---
# Deploy SSH host certificates via the oriolrius.pki_manager collection.
#
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory.yml site.yml \
#     -e ssh_ca_base_url=https://pki.example.com \
#     -e @secrets.yml   # provides ssh_ca_fleet_token (vault-encrypted)
#
- name: Deploy SSH host certificates (PKI Manager)
  hosts: sshservers
  gather_facts: true   # needs ansible_fqdn + ansible_all_ipv4_addresses
  roles:
    - role: oriolrius.pki_manager.ssh_host_cert
