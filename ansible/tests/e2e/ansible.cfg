[defaults]
# ssh_host_cert comes from the oriolrius.pki_manager collection installed by
# run.sh into ./_collections (ANSIBLE_COLLECTIONS_PATH); no local roles/ dir.
collections_path = ./_collections
inventory = inventory.ini
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
gathering = explicit
# gather only what the role needs (fqdn + ipv4) — faster, avoids docker-fact noise.
