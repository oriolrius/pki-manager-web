---
# Reload sshd so it re-reads host cert / drop-in / RevokedKeys. Two methods:
#   service — the service module (systemd or SysV), the production default.
#   command — SIGHUP the running sshd, for minimal containers (the ANS-10 e2e)
#             where no init supervises sshd.
- name: Reload sshd
  ansible.builtin.service:
    name: "{{ ssh_host_cert_sshd_service }}"
    state: reloaded
  become: true
  when: ssh_host_cert_reload_method == 'service'

- name: Reload sshd (SIGHUP)
  ansible.builtin.command: pkill -HUP -x sshd
  become: true
  changed_when: false
  failed_when: false
  when: ssh_host_cert_reload_method == 'command'

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
