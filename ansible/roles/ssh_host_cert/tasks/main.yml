---
# ssh_host_cert — provision a fully working SSH-CA node from one playbook run:
# host key + signed cert, User/Host-CA trust, login-RBAC principals, the
# authoritative sshd drop-in, unattended renewal, and a KRL revocation channel
# (public cron OR encrypted krl-client). Ordered so `sshd -t` never sees a
# dangling HostKey/HostCertificate/RevokedKeys/AuthorizedPrincipalsFile.

# ── PHASE 1: host key + signed cert + trust anchors ─────────────────────────
- name: Generate the SSH host key on the node
  ansible.builtin.include_tasks: hostkey.yml

- name: Sign + install the host certificate (initial issuance)
  ansible.builtin.include_tasks: sign.yml

- name: Install the User-CA + Host-CA trust anchors
  ansible.builtin.include_tasks: trust.yml

# ── PHASE 2: login RBAC — must exist BEFORE sshd validates the drop-in ───────
- name: Populate AuthorizedPrincipalsFile + guarantee RevokedKeys exists
  ansible.builtin.include_tasks: principals.yml
  when: ssh_host_cert_principals_enabled | bool

# revoked_keys placeholder is created here even when principals are disabled, so
# the always-written RevokedKeys fail-closed directive points at a real file.
- name: Guarantee the RevokedKeys file exists (fail-closed placeholder)
  ansible.builtin.copy:
    dest: "{{ ssh_host_cert_revoked_keys }}"
    content: ""
    owner: root
    group: root
    mode: "0444"
    force: false
  become: true
  when: not (ssh_host_cert_principals_enabled | bool)

# ── PHASE 3: authoritative sshd drop-in + validate + reload ─────────────────
- name: Install the authoritative sshd drop-in
  ansible.builtin.include_tasks: sshd.yml

# ── PHASE 4: unattended renewal ─────────────────────────────────────────────
- name: Install unattended host-cert renewal
  ansible.builtin.include_tasks: renewal.yml
  when: ssh_host_cert_renew_enabled | bool

# ── PHASE 5: KRL revocation channel ─────────────────────────────────────────
- name: Register the ECIES key + install the krl-client puller
  ansible.builtin.include_tasks: krl_client.yml
  when: ssh_host_cert_ecies_enabled | bool

- name: Install the public-path KRL refresh cron
  ansible.builtin.include_tasks: public_krl_cron.yml
  when: ssh_host_cert_krl_cron_enabled | bool

# ── PHASE 6 (optional): client-side + X.509 trust ───────────────────────────
- name: Install the known_hosts @cert-authority trust line
  ansible.builtin.include_tasks: known_hosts.yml
  when: ssh_host_cert_known_hosts_enabled | bool

- name: Install X.509 CA trust anchor + CRL refresh (stretch, non-SSH)
  ansible.builtin.include_tasks: x509.yml
  when: >-
    (ssh_host_cert_x509_ca_trust_enabled | bool) or
    (ssh_host_cert_x509_crl_cron_enabled | bool)
