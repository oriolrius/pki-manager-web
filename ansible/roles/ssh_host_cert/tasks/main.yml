---
# ssh_host_cert — generate the host key on the node, sign its public key via the
# PKI Manager external API, install the cert + sshd drop-in, and reload sshd.

# ── PHASE 1: Generate the Ed25519 host key ON THE NODE ──────────────────────
# The private key is created on the target and never leaves it.
- name: Generate Ed25519 SSH host key on the node
  community.crypto.openssh_keypair:
    backend: opensshbin
    path: "{{ ssh_host_cert_key_path }}"
    type: ed25519
    comment: "pki-manager-managed host key for {{ inventory_hostname }}"
  become: true
  register: ssh_host_cert_keydata

# ── PHASE 2: Sign the public key via the external API (on the controller) ────
# Only the public key is sent. Idempotency-Key makes retries return the same cert.
- name: Sign the host certificate via the PKI Manager external API
  ansible.builtin.uri:
    url: "{{ ssh_ca_api_url }}/sign-host"
    method: POST
    headers:
      Authorization: "Bearer {{ ssh_ca_fleet_token }}"
      Idempotency-Key: "{{ inventory_hostname }}-{{ ssh_host_cert_keydata.fingerprint }}"
    body_format: json
    body:
      fqdn: "{{ ansible_fqdn }}"
      addresses: "{{ ansible_all_ipv4_addresses }}"
      opensshHostPubkey: "{{ ssh_host_cert_keydata.public_key }}"
    status_code: 200
    validate_certs: "{{ ssh_host_cert_validate_certs }}"
  register: ssh_host_cert_signed
  delegate_to: localhost
  become: false
  no_log: true  # contains the bearer token

# ── PHASE 3: Install the signed certificate + trust bundle on the node ──────
- name: Install the signed host certificate on the node
  ansible.builtin.copy:
    content: "{{ ssh_host_cert_signed.json.certOpenssh }}\n"
    dest: "{{ ssh_host_cert_cert_path }}"
    owner: root
    group: root
    mode: "0444"
  become: true
  notify: Reload sshd

- name: Fetch the User CA trust bundle (TrustedUserCAKeys)
  ansible.builtin.uri:
    url: "{{ ssh_ca_base_url }}/ssh/trusted-user-ca-keys"
    method: GET
    return_content: true
    status_code: 200
    validate_certs: "{{ ssh_host_cert_validate_certs }}"
  register: ssh_host_cert_user_ca
  delegate_to: localhost
  become: false

- name: Install the User CA public key on the node
  ansible.builtin.copy:
    content: "{{ ssh_host_cert_user_ca.content }}"
    dest: "{{ ssh_host_cert_user_ca_pub }}"
    owner: root
    group: root
    mode: "0444"
  become: true
  notify: Reload sshd

# The Host CA trust anchor MUST land before the per-host composed-KRL cutover
# (BLK-10/BLK-12 runbook ordering): composed KRLs are signed with the HOST CA
# key and krl-client verifies against this file by default — without it every
# pull fails signature verification and blocks silently never land.
- name: Fetch the Host CA trust anchor (KRL signature verification)
  ansible.builtin.uri:
    url: "{{ ssh_ca_base_url }}/ssh/host-ca-keys"
    method: GET
    return_content: true
    status_code: 200
    validate_certs: "{{ ssh_host_cert_validate_certs }}"
  register: ssh_host_cert_host_ca
  delegate_to: localhost
  become: false

- name: Install the Host CA public key on the node (KRL puller trust anchor)
  ansible.builtin.copy:
    content: "{{ ssh_host_cert_host_ca.content }}"
    dest: "{{ ssh_host_cert_host_ca_pub }}"
    owner: root
    group: root
    mode: "0444"
  become: true

# ── PHASE 4: Configure sshd ─────────────────────────────────────────────────
- name: Configure sshd for SSH certificates (drop-in)
  ansible.builtin.blockinfile:
    path: "{{ ssh_host_cert_dropin }}"
    create: true
    owner: root
    group: root
    mode: "0644"
    marker: "# {mark} ANSIBLE pki-manager ssh_host_cert"
    block: |
      HostKey {{ ssh_host_cert_key_path }}
      HostCertificate {{ ssh_host_cert_cert_path }}
      TrustedUserCAKeys {{ ssh_host_cert_user_ca_pub }}
      AuthorizedPrincipalsFile {{ ssh_host_cert_dirname }}/auth_principals/%u
      RevokedKeys {{ ssh_host_cert_revoked_keys }}
  become: true
  notify: Reload sshd

- name: Validate the full sshd configuration before reload
  ansible.builtin.command: /usr/sbin/sshd -t
  become: true
  changed_when: false

# ── PHASE 5 (optional): ECIES KRL distribution (SSH-15/SSH-24) ──────────────
- name: Register the host's ECIES key for encrypted KRL distribution
  ansible.builtin.uri:
    url: "{{ ssh_ca_api_url }}/register-host-pubkey"
    method: POST
    headers:
      Authorization: "Bearer {{ ssh_ca_fleet_token }}"
    body_format: json
    body:
      fqdn: "{{ ansible_fqdn }}"
    status_code: 200
    validate_certs: "{{ ssh_host_cert_validate_certs }}"
  register: ssh_host_cert_ecies
  delegate_to: localhost
  become: false
  no_log: true
  when: ssh_host_cert_ecies_enabled | bool

# ── PHASE 6 (optional): public-path KRL refresh cron (BLK-12) ───────────────
# Only for hosts NOT using the encrypted channel (host_puller.sh / krl-client).
# The atomic mv keeps sshd's fail-closed RevokedKeys consistent at all times.
- name: Install the public KRL refresh cron (RevokedKeys)
  ansible.builtin.copy:
    dest: /etc/cron.d/pki-manager-krl
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by pki-manager ssh_host_cert (BLK-12). Refreshes RevokedKeys.
      */{{ ssh_host_cert_krl_cron_minutes }} * * * * root curl -fsS --max-time 30 -o {{ ssh_host_cert_revoked_keys }}.tmp "{{ ssh_host_cert_krl_fetch_url }}" && install -m 0444 -o root -g root {{ ssh_host_cert_revoked_keys }}.tmp {{ ssh_host_cert_revoked_keys }} && rm -f {{ ssh_host_cert_revoked_keys }}.tmp
  become: true
  when: ssh_host_cert_krl_cron_enabled | bool
