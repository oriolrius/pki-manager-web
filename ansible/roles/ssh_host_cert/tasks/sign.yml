---
# Sign the host public key via the external API (on the controller). Only the
# public key is sent. The initial Idempotency-Key is keyed on host+fingerprint
# so re-runs return the same cert; the ANS-04 renewal job rotates a period
# bucket into its own key to mint fresh certs before expiry.
- name: Sign the host certificate via the PKI Manager external API
  ansible.builtin.uri:
    url: "{{ ssh_ca_api_url }}/sign-host"
    method: POST
    headers:
      Authorization: "Bearer {{ ssh_ca_fleet_token }}"
      Idempotency-Key: "{{ inventory_hostname }}-{{ ssh_host_cert_keydata.fingerprint }}"
    body_format: json
    body:
      fqdn: "{{ ansible_fqdn }}"
      addresses: "{{ ansible_all_ipv4_addresses }}"
      opensshHostPubkey: "{{ ssh_host_cert_keydata.public_key }}"
    status_code: 200
    validate_certs: "{{ ssh_host_cert_validate_certs }}"
  register: ssh_host_cert_signed
  delegate_to: localhost
  become: false
  changed_when: false  # the cert-install copy below detects real change
  no_log: true  # contains the bearer token

# The server-side host id — used to fetch the authoritative sshd drop-in (ANS-03).
- name: Record the server-side host id
  ansible.builtin.set_fact:
    ssh_host_cert_host_id: "{{ ssh_host_cert_signed.json.hostId }}"

- name: Install the signed host certificate on the node
  ansible.builtin.copy:
    content: "{{ ssh_host_cert_signed.json.certOpenssh }}\n"
    dest: "{{ ssh_host_cert_cert_path }}"
    owner: root
    group: root
    mode: "0444"
  become: true
  notify:
    - Reload sshd
    - Reload sshd (SIGHUP)
