---
# ANS-08: for hosts that are also SSH CLIENTS (bastion/jump, CI runners), trust
# the Host CA via a known_hosts @cert-authority line so they connect to other
# cert-presenting hosts under StrictHostKeyChecking=yes with no TOFU. The line
# is rendered by GET /ssh/cert-authority (single source of truth, ssh-config.ts).
- name: Fetch the @cert-authority known_hosts line for the Host CA
  ansible.builtin.uri:
    url: "{{ ssh_ca_base_url }}/ssh/cert-authority?pattern={{ ssh_host_cert_known_hosts_pattern | urlencode }}"
    method: GET
    return_content: true
    body_format: raw
    status_code: 200
    validate_certs: "{{ ssh_host_cert_validate_certs }}"
  register: ssh_host_cert_cert_authority
  delegate_to: localhost
  become: false
  changed_when: false

# blockinfile keeps the managed line(s) idempotent and separable from any
# operator-managed known_hosts entries. The rendered pattern is '*'; override
# via ssh_host_cert_known_hosts_pattern → re-render server-side if you need a
# narrower pattern (the endpoint takes ?pattern=).
- name: Install the @cert-authority line into known_hosts
  ansible.builtin.blockinfile:
    path: "{{ ssh_host_cert_known_hosts_path }}"
    create: true
    owner: root
    group: root
    mode: "0644"
    marker: "# {mark} ANSIBLE pki-manager cert-authority"
    block: "{{ ssh_host_cert_cert_authority.content | trim }}"
  become: true
