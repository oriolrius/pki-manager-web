---
# Public-path KRL refresh cron (BLK-12), for hosts NOT on the encrypted channel.
# tmp-write + same-filesystem mv keeps sshd's fail-closed RevokedKeys consistent
# at all times (never modified in place, per sshd_config(5)).
- name: Install the public KRL refresh cron (RevokedKeys)
  ansible.builtin.copy:
    dest: /etc/cron.d/pki-manager-krl
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by pki-manager ssh_host_cert (BLK-12). Refreshes RevokedKeys.
      */{{ ssh_host_cert_krl_cron_minutes }} * * * * root curl -fsS --max-time 30 -o {{ ssh_host_cert_revoked_keys }}.tmp "{{ ssh_host_cert_krl_fetch_url }}" && chmod 0444 {{ ssh_host_cert_revoked_keys }}.tmp && mv -f {{ ssh_host_cert_revoked_keys }}.tmp {{ ssh_host_cert_revoked_keys }}
  become: true
