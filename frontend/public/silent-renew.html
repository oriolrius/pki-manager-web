<!DOCTYPE html>
<html>
<head>
  <title>Silent Token Renewal</title>
</head>
<body>
  <!--
    Silent token renewal page for OIDC authentication.
    This page is loaded in a hidden iframe to refresh tokens before expiry.

    Reference: decision-009 - OIDC Authentication Implementation
  -->
  <script src="https://cdn.jsdelivr.net/npm/oidc-client-ts@3.4.1/dist/browser/oidc-client-ts.min.js"></script>
  <script>
    // Handle silent renewal callback
    new oidc.UserManager({ response_mode: 'query' }).signinSilentCallback()
      .catch(function(error) {
        console.error('Silent renewal error:', error);
      });
  </script>
</body>
</html>
