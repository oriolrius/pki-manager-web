# Mosquitto 2.x: MQTT over TLS on 8883, client certificate required.
# Files come from PKI Manager (see docs/guides/mqtt.md).
listener 8883
cafile   /mosquitto/certs/ca.pem
certfile /mosquitto/certs/server.pem
keyfile  /mosquitto/certs/server.key
crlfile  /mosquitto/certs/crl.pem

# Mutual TLS: no certificate, no connection.
require_certificate true
# The certificate CN becomes the MQTT user name.
use_identity_as_username true

connection_messages true
log_dest stdout
