<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:708px;height:511px;background:#FFFFFF;" width="708px" height="511px" viewBox="0 0 708 511" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="181.414" y="35.12" fill="#151652" font-size="22" textLength="338.691" font-weight="700" font-family="Ubuntu">The deploy bundle on the server</text></g><!--cluster cfg--><g class="cluster" data-qualified-name="cfg" id="ent0001" data-source-line="5"><rect x="7" y="61.278" width="402" height="399" fill="#F4F4F4" style="stroke:#54595F;stroke-width:1.4;" rx="5" ry="5"/><text x="81.013" y="80.718" fill="#151652" font-size="14" textLength="253.973" font-weight="700" font-family="Ubuntu">/etc/ssh/sshd_config.d/60-ssh-ca.conf</text></g><!--entity l1--><g class="entity" data-qualified-name="cfg.l1" id="ent0002" data-source-line="6"><rect x="73.5" y="104.278" width="268.897" height="44.086" fill="#0C8760" style="stroke:#0A7C58;stroke-width:1.4;" rx="5" ry="5"/><text x="87.5" y="131.718" fill="#FFF" font-size="14" textLength="240.897" font-family="Ubuntu">HostKey /etc/ssh/ssh_host_ecdsa_key</text></g><!--entity l2--><g class="entity" data-qualified-name="cfg.l2" id="ent0003" data-source-line="7"><rect x="23" y="178.278" width="370.131" height="44.086" fill="#0C8760" style="stroke:#0A7C58;stroke-width:1.4;" rx="5" ry="5"/><text x="37" y="205.718" fill="#FFF" font-size="14" textLength="342.131" font-family="Ubuntu">HostCertificate /etc/ssh/ssh_host_ecdsa_key-cert.pub</text></g><!--entity l3--><g class="entity" data-qualified-name="cfg.l3" id="ent0004" data-source-line="8"><rect x="52" y="252.278" width="312.157" height="44.086" fill="#F60" style="stroke:#C95000;stroke-width:1.4;" rx="5" ry="5"/><text x="66" y="279.718" fill="#FFF" font-size="14" textLength="284.157" font-family="Ubuntu">TrustedUserCAKeys /etc/ssh/ssh-user-ca.pub</text></g><!--entity l4--><g class="entity" data-qualified-name="cfg.l4" id="ent0005" data-source-line="9"><rect x="25.5" y="326.278" width="364.671" height="44.086" fill="#F4F4F4" style="stroke:#54595F;stroke-width:1.4;" rx="5" ry="5"/><text x="39.5" y="353.718" fill="#151652" font-size="14" textLength="336.671" font-family="Ubuntu">AuthorizedPrincipalsFile /etc/ssh/auth_principals/%u</text></g><!--entity l5--><g class="entity" data-qualified-name="cfg.l5" id="ent0006" data-source-line="10"><rect x="78" y="400.278" width="260.063" height="44.086" fill="#F4F4F4" style="stroke:#54595F;stroke-width:1.4;" rx="5" ry="5"/><text x="92" y="427.718" fill="#151652" font-size="14" textLength="232.063" font-family="Ubuntu">RevokedKeys /etc/ssh/revoked_keys</text></g><!--entity w2--><g class="entity" data-qualified-name="w2" id="ent0007" data-source-line="12"><rect x="454" y="174.278" width="219.547" height="44.086" fill="#FFF" style="stroke:#151652;stroke-width:1.4;" rx="5" ry="5"/><text x="468" y="201.718" fill="#151652" font-size="14" textLength="191.547" font-family="Ubuntu">Show this certificate to clients</text></g><!--entity w3--><g class="entity" data-qualified-name="w3" id="ent0008" data-source-line="13"><rect x="444" y="248.278" width="240.085" height="44.086" fill="#FFF" style="stroke:#151652;stroke-width:1.4;" rx="5" ry="5"/><text x="458" y="275.718" fill="#151652" font-size="14" textLength="212.085" font-family="Ubuntu">Trust users signed by the User CA</text></g><!--entity w4--><g class="entity" data-qualified-name="w4" id="ent0009" data-source-line="14"><rect x="436.5" y="322.278" width="255.457" height="60.172" fill="#FFF" style="stroke:#151652;stroke-width:1.4;" rx="5" ry="5"/><text x="450.5" y="349.718" fill="#151652" font-size="14" textLength="227.457" font-family="Ubuntu">Allowed principals per local account</text><text x="450.5" y="365.804" fill="#151652" font-size="14" textLength="132.229" font-family="Ubuntu">(%u = account name)</text></g><!--entity w5--><g class="entity" data-qualified-name="w5" id="ent0010" data-source-line="15"><rect x="433" y="412.278" width="261.519" height="60.172" fill="#FFF" style="stroke:#151652;stroke-width:1.4;" rx="5" ry="5"/><text x="447" y="439.718" fill="#151652" font-size="14" textLength="130.844" font-family="Ubuntu">Refuse revoked keys</text><text x="447" y="455.804" fill="#C62828" font-size="14" textLength="233.519" font-family="Ubuntu">missing file = every key login refused</text></g><!--link l2 to w2--><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" id="lnk11" data-source-line="16" data-link-type="dependency"><path d="M393.26,198.198 C413.92,197.958 429.45,197.785 448.72,197.565" style="stroke:#54595F;stroke-width:1.6;" fill="none" id="l2-to-w2"/><polygon points="453.72,197.508,444.675,193.611,448.72,197.565,444.766,201.611,453.72,197.508" fill="#54595F" style="stroke:#54595F;stroke-width:1.6;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link l3 to w3--><g class="link" data-entity-1="ent0004" data-entity-2="ent0008" id="lnk12" data-source-line="17" data-link-type="dependency"><path d="M364.01,272.528 C390.78,272.228 413.24,271.975 438.87,271.685" style="stroke:#54595F;stroke-width:1.6;" fill="none" id="l3-to-w3"/><polygon points="443.87,271.628,434.825,267.73,438.87,271.685,434.916,275.73,443.87,271.628" fill="#54595F" style="stroke:#54595F;stroke-width:1.6;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link l4 to w4--><g class="link" data-entity-1="ent0005" data-entity-2="ent0009" id="lnk13" data-source-line="18" data-link-type="dependency"><path d="M390.67,350.328 C406.11,350.508 416.52,350.621 431.4,350.791" style="stroke:#54595F;stroke-width:1.6;" fill="none" id="l4-to-w4"/><polygon points="436.4,350.848,427.446,346.746,431.4,350.791,427.355,354.745,436.4,350.848" fill="#54595F" style="stroke:#54595F;stroke-width:1.6;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><