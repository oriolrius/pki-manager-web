<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:755px;height:435px;background:#FFFFFF;" width="755px" height="435px" viewBox="0 0 755 435" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="177"><text x="172.316" y="30.421" fill="#151652" font-size="22" textLength="403.434" font-weight="700" font-family="Ubuntu">The deploy bundle on the server</text></g><!--cluster cfg--><g class="cluster" data-qualified-name="cfg" id="ent0001" data-source-line="180"><rect x="7" y="53.609" width="424.92" height="351" fill="#F4F4F4" style="stroke:#54595F;stroke-width:1.4;" rx="5" ry="5"/><text x="72.392" y="68.604" fill="#151652" font-size="14" textLength="294.137" font-weight="700" font-family="Ubuntu">/etc/ssh/sshd_config.d/60-ssh-ca.conf</text></g><!--entity l1--><g class="entity" data-qualified-name="cfg.l1" id="ent0002" data-source-line="181"><rect x="78.17" y="352.459" width="282.575" height="36.297" fill="#0C8760" style="stroke:#0A7C58;stroke-width:1.4;" rx="5" ry="5"/><text x="88.17" y="375.454" fill="#FFF" font-size="14" textLength="262.575" font-family="Ubuntu">HostKey /etc/ssh/ssh_host_ecdsa_key</text></g><!--entity l2--><g class="entity" data-qualified-name="cfg.l2" id="ent0003" data-source-line="182"><rect x="23" y="88.459" width="392.921" height="36.297" fill="#0C8760" style="stroke:#0A7C58;stroke-width:1.4;" rx="5" ry="5"/><text x="33" y="111.454" fill="#FFF" font-size="14" textLength="372.921" font-family="Ubuntu">HostCertificate /etc/ssh/ssh_host_ecdsa_key-cert.pub</text></g><!--entity l3--><g class="entity" data-qualified-name="cfg.l3" id="ent0004" data-source-line="183"><rect x="52.74" y="154.459" width="333.435" height="36.297" fill="#F60" style="stroke:#C95000;stroke-width:1.4;" rx="5" ry="5"/><text x="62.74" y="177.454" fill="#FFF" font-size="14" textLength="313.435" font-family="Ubuntu">TrustedUserCAKeys /etc/ssh/ssh-user-ca.pub</text></g><!--entity l4--><g class="entity" data-qualified-name="cfg.l4" id="ent0005" data-source-line="184"><rect x="27.1" y="220.459" width="384.725" height="36.297" fill="#F4F4F4" style="stroke:#54595F;stroke-width:1.4;" rx="5" ry="5"/><text x="37.1" y="243.454" fill="#151652" font-size="14" textLength="364.725" font-family="Ubuntu">AuthorizedPrincipalsFile /etc/ssh/auth_principals/%u</text></g><!--entity l5--><g class="entity" data-qualified-name="cfg.l5" id="ent0006" data-source-line="185"><rect x="82.38" y="286.459" width="274.16" height="36.297" fill="#F4F4F4" style="stroke:#54595F;stroke-width:1.4;" rx="5" ry="5"/><text x="92.38" y="309.454" fill="#151652" font-size="14" textLength="254.16" font-family="Ubuntu">RevokedKeys /etc/ssh/revoked_keys</text></g><!--entity w2--><g class="entity" data-qualified-name="w2" id="ent0007" data-source-line="187"><rect x="482.71" y="84.459" width="231.565" height="36.297" fill="#FFF" style="stroke:#151652;stroke-width:1.4;" rx="5" ry="5"/><text x="492.71" y="107.454" fill="#151652" font-size="14" textLength="211.565" font-family="Ubuntu">Show this certificate to clients</text></g><!--entity w3--><g class="entity" data-qualified-name="w3" id="ent0008" data-source-line="188"><rect x="469.32" y="150.459" width="258.349" height="36.297" fill="#FFF" style="stroke:#151652;stroke-width:1.4;" rx="5" ry="5"/><text x="479.32" y="173.454" fill="#151652" font-size="14" textLength="238.349" font-family="Ubuntu">Trust users signed by the User CA</text></g><!--entity w4--><g class="entity" data-qualified-name="w4" id="ent0009" data-source-line="189"><rect x="462.51" y="216.309" width="271.966" height="52.594" fill="#FFF" style="stroke:#151652;stroke-width:1.4;" rx="5" ry="5"/><text x="472.51" y="239.304" fill="#151652" font-size="14" textLength="251.966" font-family="Ubuntu">Allowed principals per local account</text><text x="472.51" y="255.601" fill="#151652" font-size="14" textLength="153.658" font-family="Ubuntu">(%u = account name)</text></g><!--entity w5--><g class="entity" data-qualified-name="w5" id="ent0010" data-source-line="190"><rect x="455.92" y="299.309" width="285.146" height="52.594" fill="#FFF" style="stroke:#151652;stroke-width:1.4;" rx="5" ry="5"/><text x="465.92" y="322.304" fill="#151652" font-size="14" textLength="146.077" font-family="Ubuntu">Refuse revoked keys</text><text x="465.92" y="338.601" fill="#C62828" font-size="14" textLength="265.146" font-family="Ubuntu">missing file = every key login refused</text></g><!--link l2 to w2--><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" id="lnk11" data-source-line="191" data-link-type="dependency"><path d="M416.16,104.529 C438.75,104.289 456.2,104.114 477.22,103.884" style="stroke:#54595F;stroke-width:1.6;" fill="none" id="l2-to-w2"/><polygon points="482.22,103.829,473.177,99.928,477.22,103.884,473.264,107.928,482.22,103.829" fill="#54595F" style="stroke:#54595F;stroke-width:1.6;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link l3 to w3--><g class="link" data-entity-1="ent0004" data-entity-2="ent0008" id="lnk12" data-source-line="192" data-link-type="dependency"><path d="M386.66,170.849 C414.29,170.549 437.58,170.302 464.1,170.022" style="stroke:#54595F;stroke-width:1.6;" fill="none" id="l3-to-w3"/><polygon points="469.1,169.969,460.058,166.065,464.1,170.022,460.143,174.064,469.1,169.969" fill="#54595F" style="stroke:#54595F;stroke-width:1.6;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link l4 to w4--><g class="link" data-entity-1="ent0005" data-entity-2="ent0009" id="lnk13" data-source-line="193" data-link-type="dependency"><path d="M412.29,240.649 C429.12,240.819 440.91,240.947 457.13,241.117" style="stroke:#54595F;stroke-width:1.6;" fill="none" id="l4-to-w4"/><polygon points="462.13,241.169,453.172,237.075,457.13,241.117,453.089,245.075,462.13,241.169" fill="#54595F" style="stroke:#54595F;stroke-wid