<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1175px;height:325px;background:#FFFFFF;" width="1175px" height="325px" viewBox="0 0 1175 325" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="177"><text x="298.052" y="30.421" fill="#151652" font-size="22" textLength="572.397" font-weight="700" font-family="Ubuntu">Per-host access block: one person, one server</text></g><!--entity r1--><g class="entity" data-qualified-name="r1" id="ent0001" data-source-line="180"><rect x="8.56" y="123.609" width="162.338" height="36.297" fill="#FDECEC" style="stroke:#C62828;stroke-width:1.4;" rx="5" ry="5"/><text x="18.56" y="146.604" fill="#8E1B1B" font-size="14" textLength="142.338" font-family="Ubuntu">Host-CA revocations</text></g><!--entity r2--><g class="entity" data-qualified-name="r2" id="ent0002" data-source-line="181"><rect x="8.54" y="53.609" width="162.372" height="36.297" fill="#FDECEC" style="stroke:#C62828;stroke-width:1.4;" rx="5" ry="5"/><text x="18.54" y="76.604" fill="#8E1B1B" font-size="14" textLength="142.372" font-family="Ubuntu">User-CA revocations</text></g><!--entity r3--><g class="entity" data-qualified-name="r3" id="ent0003" data-source-line="182"><rect x="7" y="189.459" width="165.462" height="52.594" fill="#FDECEC" style="stroke:#C62828;stroke-width:1.4;" rx="5" ry="5"/><text x="17" y="212.454" fill="#8E1B1B" font-size="14" textLength="145.462" font-family="Ubuntu">Active blocks on db1</text><text x="17" y="228.751" fill="#8E1B1B" font-size="14" textLength="92.483" font-family="Ubuntu">(Alice's keys)</text></g><!--entity krl--><g class="entity" data-qualified-name="krl" id="ent0004" data-source-line="183"><rect x="213.46" y="152.459" width="217.606" height="52.594" fill="#F4F4F4" style="stroke:#54595F;stroke-width:1.4;" rx="5" ry="5"/><text x="223.46" y="175.454" fill="#151652" font-size="14" textLength="64.313" font-family="Ubuntu">KRL(db1)</text><text x="223.46" y="191.751" fill="#151652" font-size="14" textLength="197.606" font-family="Ubuntu">signed with the Host CA key</text></g><!--entity db1--><g class="entity" data-qualified-name="db1" id="ent0005" data-source-line="184"><rect x="820.54" y="152.459" width="109.489" height="52.594" fill="#151652" style="stroke:#0E0F3A;stroke-width:1.4;" rx="5" ry="5"/><text x="830.54" y="175.454" fill="#FFF" font-size="14" textLength="26.681" font-family="Ubuntu">db1</text><text x="830.54" y="191.751" fill="#FFF" font-size="14" textLength="89.489" font-family="Ubuntu">refuses Alice</text></g><!--entity krlw--><g class="entity" data-qualified-name="krlw" id="ent0006" data-source-line="185"><rect x="274.52" y="55.459" width="95.489" height="52.594" fill="#F4F4F4" style="stroke:#54595F;stroke-width:1.4;" rx="5" ry="5"/><text x="284.52" y="78.454" fill="#151652" font-size="14" textLength="75.489" font-family="Ubuntu">KRL(web1)</text><text x="284.52" y="94.751" fill="#151652" font-size="14" textLength="59.035" font-family="Ubuntu">no block</text></g><!--entity web1--><g class="entity" data-qualified-name="web1" id="ent0007" data-source-line="186"><rect x="819.1" y="55.459" width="112.374" height="52.594" fill="#151652" style="stroke:#0E0F3A;stroke-width:1.4;" rx="5" ry="5"/><text x="829.1" y="78.454" fill="#FFF" font-size="14" textLength="37.857" font-family="Ubuntu">web1</text><text x="829.1" y="94.751" fill="#FFF" font-size="14" textLength="92.374" font-family="Ubuntu">accepts Alice</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="195"><path d="M590.07,240.159 L590.07,305.347 A5,5 0 0 0 595.07,310.347 L1155.502,310.347 A5,5 0 0 0 1160.502,305.347 L1160.502,245.159 L1150.502,235.159 L879.28,235.159 L875.28,205.529 L871.28,235.159 L595.07,235.159 A5,5 0 0 0 590.07,240.159" style="stroke:#F46524;stroke-width:0.5;" fill="#FFF4EC"/><path d="M1150.502,235.159 L1150.502,242.659 A2.5,2.5 0 0 0 1153.002,245.159 L1160.502,245.159 L1150.502,235.159" style="stroke:#F46524;stroke-width:0.5;" fill="#FFF4EC"/><text x="596.07" y="253.154" fill="#575757" font-size="14" textLength="482.152" font-family="Ubuntu">A block is NOT a revocation: Alice's certificate stays valid elsewhere.</text><text x="596.07" y="269.451" fill="#575757" font-size="14" textLength="479.343" font-family="Ubuntu">Blocks match keys: identities that share a key are blocked together.</text><text x="596.07" y="285.748" fill="#575757" font-size="14" textLength="549.432" font-family="Ubuntu">Needs krl-client. Optional SSH_BLOCK_ISSUANCE_GATE stops NEW certificates</text><text x="596.07" y="302.045" fill="#575757" font-size="14" textLength="219.57" font-family="Ubuntu">from opening the blocked host.</text></g><!--link r1 to krl--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk8" data-source-line="187" data-link-type="dependency"><path d="M171.24,155.299 C178.41,156.479 185.57,157.639 192.46,158.759 C199.16,159.839 201.121,160.159 208.081,161.259" style="stroke:#54595F;stroke-width:1.6;" fill="none" id="r1-to-krl"/><polygon points="213.02,162.039,204.755,156.683,208.081,161.259,203.506,164.585,213.02,162.039" fill="#54595F" style="stroke:#54595F;stroke-width:1.6;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link r2 to krl--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk9" data-source-line="188" data-link-type="dependency"><path d="M131.94,90.269 C144.93,96.139 159.31,102.689 172.46,108.759 C203.05,122.869 232.529,136.714 260.309,149.834" style="stroke:#54595F;stroke-width:1.6;" fill="none" id="r2-to-krl"/><polygon points="264.83,151.969,258.4,144.509,260.309,149.834,254.984,151.743,264.83,151.969" fill="#54595F" style="stroke:#54595F;stroke-width:1.6;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link r3 to krl--><g class="link" data-entity-1="ent0003" data-enti