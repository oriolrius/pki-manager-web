<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1109px;height:351px;background:#FFFFFF;" width="1109px" height="351px" viewBox="0 0 1109 351" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="312.909" y="35.12" fill="#151652" font-size="22" textLength="476.478" font-weight="700" font-family="Ubuntu">Per-host access block: one person, one server</text></g><!--entity r1--><g class="entity" data-qualified-name="r1" id="ent0001" data-source-line="5"><rect x="8" y="135.278" width="157.429" height="44.086" fill="#FDECEC" style="stroke:#C62828;stroke-width:1.4;" rx="5" ry="5"/><text x="22" y="162.718" fill="#8E1B1B" font-size="14" textLength="129.429" font-family="Ubuntu">Host-CA revocations</text></g><!--entity r2--><g class="entity" data-qualified-name="r2" id="ent0002" data-source-line="6"><rect x="8" y="61.278" width="156.533" height="44.086" fill="#FDECEC" style="stroke:#C62828;stroke-width:1.4;" rx="5" ry="5"/><text x="22" y="88.718" fill="#8E1B1B" font-size="14" textLength="128.533" font-family="Ubuntu">User-CA revocations</text></g><!--entity r3--><g class="entity" data-qualified-name="r3" id="ent0003" data-source-line="7"><rect x="7" y="209.278" width="158.592" height="60.172" fill="#FDECEC" style="stroke:#C62828;stroke-width:1.4;" rx="5" ry="5"/><text x="21" y="236.718" fill="#8E1B1B" font-size="14" textLength="130.592" font-family="Ubuntu">Active blocks on db1</text><text x="21" y="252.804" fill="#8E1B1B" font-size="14" textLength="81.242" font-family="Ubuntu">(Alice's keys)</text></g><!--entity krl--><g class="entity" data-qualified-name="krl" id="ent0004" data-source-line="8"><rect x="207" y="164.278" width="205.701" height="60.172" fill="#F4F4F4" style="stroke:#54595F;stroke-width:1.4;" rx="5" ry="5"/><text x="221" y="191.718" fill="#151652" font-size="14" textLength="58.338" font-family="Ubuntu">KRL(db1)</text><text x="221" y="207.804" fill="#151652" font-size="14" textLength="177.701" font-family="Ubuntu">signed with the Host CA key</text></g><!--entity db1--><g class="entity" data-qualified-name="db1" id="ent0005" data-source-line="9"><rect x="774.5" y="164.278" width="109.2" height="60.172" fill="#151652" style="stroke:#0E0F3A;stroke-width:1.4;" rx="5" ry="5"/><text x="788.5" y="191.718" fill="#FFF" font-size="14" textLength="24.388" font-family="Ubuntu">db1</text><text x="788.5" y="207.804" fill="#FFF" font-size="14" textLength="81.2" font-family="Ubuntu">refuses Alice</text></g><!--entity krlw--><g class="entity" data-qualified-name="krlw" id="ent0006" data-source-line="10"><rect x="261.5" y="64.278" width="96.796" height="60.172" fill="#F4F4F4" style="stroke:#54595F;stroke-width:1.4;" rx="5" ry="5"/><text x="275.5" y="91.718" fill="#151652" font-size="14" textLength="68.796" font-family="Ubuntu">KRL(web1)</text><text x="275.5" y="107.804" fill="#151652" font-size="14" textLength="53.676" font-family="Ubuntu">no block</text></g><!--entity web1--><g class="entity" data-qualified-name="web1" id="ent0007" data-source-line="11"><rect x="774" y="64.278" width="110.488" height="60.172" fill="#151652" style="stroke:#0E0F3A;stroke-width:1.4;" rx="5" ry="5"/><text x="788" y="91.718" fill="#FFF" font-size="14" textLength="34.846" font-family="Ubuntu">web1</text><text x="788" y="107.804" fill="#FFF" font-size="14" textLength="82.488" font-family="Ubuntu">accepts Alice</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="20"><path d="M564,259.278 L564,331.622 A5,5 0 0 0 569,336.622 L1089.296,336.622 A5,5 0 0 0 1094.296,331.622 L1094.296,264.278 L1084.296,254.278 L833,254.278 L829,224.728 L825,254.278 L569,254.278 A5,5 0 0 0 564,259.278" style="stroke:#F46524;stroke-width:0.5;" fill="#FFF4EC"/><path d="M1084.296,254.278 L1084.296,261.778 A2.5,2.5 0 0 0 1086.796,264.278 L1094.296,264.278 L1084.296,254.278" style="stroke:#F46524;stroke-width:0.5;" fill="#FFF4EC"/><text x="574" y="276.718" fill="#575757" font-size="14" textLength="430.247" font-family="Ubuntu">A block is NOT a revocation: Alice's certificate stays valid elsewhere.</text><text x="574" y="292.804" fill="#575757" font-size="14" textLength="426.411" font-family="Ubuntu">Blocks match keys: identities that share a key are blocked together.</text><text x="574" y="308.89" fill="#575757" font-size="14" textLength="501.296" font-family="Ubuntu">Needs krl-client. Optional SSH_BLOCK_ISSUANCE_GATE stops NEW certificates</text><text x="574" y="324.976" fill="#575757" font-size="14" textLength="199.331" font-family="Ubuntu">from opening the blocked host.</text></g><!--link r1 to krl--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk8" data-source-line="12" data-link-type="dependency"><path d="M165.18,170.758 C172.22,171.958 179.24,173.148 186,174.278 C192.83,175.418 194.937,175.785 202.037,176.955" style="stroke:#54595F;stroke-width:1.6;" fill="none" id="r1-to-krl"/><polygon points="206.97,177.768,198.74,172.358,202.037,176.955,197.439,180.251,206.97,177.768" fill="#54595F" style="stroke:#54595F;stroke-width:1.6;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link r2 to krl--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk9" data-source-line="13" data-link-type="dependency"><path d="M134.96,105.298 C145.23,110.158 156,115.338 166,120.278 C194.57,134.398 221.618,148.304 247.758,161.954" style="stroke:#54595F;stroke-width:1.6;" fill="none" id="r2-to-krl"/><polygon points="252.19,164.268,246.064,156.556,247.758,161.954,242.361,163.648,252.19,164.268" fill="#54595F" style="stroke:#54595F;stroke-width:1.6;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link r3 to krl--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk10" data-source-line="14" data-link-type="dependency"><path d="M166.22,22