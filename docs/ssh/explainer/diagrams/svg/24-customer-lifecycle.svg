<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:532px;height:938px;background:#FFFFFF;" width="532px" height="938px" viewBox="0 0 532 938" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="177"><text x="20" y="40.421" fill="#151652" font-size="22" textLength="490.016" font-weight="700" font-family="Ubuntu">Customers: onboard, move people, exit</text></g><ellipse cx="179.335" cy="71.609" rx="10" ry="10" fill="#151652" style="stroke:#222;stroke-width:1;"/><rect x="22.722" y="91.609" width="313.226" height="269.781" fill="#F4F4F4" style="stroke:#D5D6D7;stroke-width:1.5;" rx="5" ry="5"/><path d="M212.507,91.609 L212.507,100.906 L202.507,110.906 L22.722,110.906" style="stroke:#D5D6D7;stroke-width:1.5;" fill="none"/><text x="25.722" y="105.604" fill="#151652" font-size="14" textLength="179.785" font-family="Ubuntu">New customer (Umbrella)</text><rect x="58.483" y="127.906" width="241.703" height="36.297" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="68.483" y="150.901" fill="#151652" font-size="14" textLength="221.703" font-family="Ubuntu">Create principal client-umbrella</text><rect x="32.722" y="184.203" width="293.226" height="36.297" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="42.722" y="207.198" fill="#151652" font-size="14" textLength="273.226" font-family="Ubuntu">Map it on Umbrella's servers -> deploy</text><rect x="64.929" y="240.5" width="228.811" height="36.297" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="74.929" y="263.495" fill="#151652" font-size="14" textLength="208.811" font-family="Ubuntu">Deploy the files, Mark pushed</text><rect x="67.278" y="296.797" width="224.114" height="52.594" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="77.278" y="319.792" fill="#151652" font-size="14" textLength="204.114" font-family="Ubuntu">Add it to the NEXT certificate</text><text x="77.278" y="336.089" fill="#151652" font-size="14" textLength="202.364" font-family="Ubuntu">of the people on the account</text><rect x="17.711" y="371.391" width="323.247" height="197.188" fill="#F4F4F4" style="stroke:#D5D6D7;stroke-width:1.5;" rx="5" ry="5"/><path d="M224.333,371.391 L224.333,380.688 L214.333,390.688 L17.711,390.688" style="stroke:#D5D6D7;stroke-width:1.5;" fill="none"/><text x="20.711" y="385.386" fill="#151652" font-size="14" textLength="196.622" font-family="Ubuntu">Ana moves Acme -> Globex</text><rect x="27.711" y="407.688" width="303.247" height="36.297" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="37.711" y="430.683" fill="#151652" font-size="14" textLength="283.247" font-family="Ubuntu">Issue new cert: developers client-globex</text><rect x="63.258" y="463.984" width="232.153" height="36.297" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="73.258" y="486.979" fill="#151652" font-size="14" textLength="212.153" font-family="Ubuntu">Revoke the old cert (by serial)</text><rect x="33.696" y="520.281" width="291.277" height="36.297" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="43.696" y="543.276" fill="#151652" font-size="14" textLength="271.277" font-family="Ubuntu">Acme refuses it after the next KRL pull</text><rect x="25.822" y="578.578" width="307.025" height="269.781" fill="#F4F4F4" style="stroke:#D5D6D7;stroke-width:1.5;" rx="5" ry="5"/><path d="M264.887,578.578 L264.887,587.875 L254.887,597.875 L25.822,597.875" style="stroke:#D5D6D7;stroke-width:1.5;" fill="none"/><text x="28.822" y="592.573" fill="#151652" font-size="14" textLength="229.065" font-family="Ubuntu">Customer leaves with its servers</text><rect x="35.822" y="614.875" width="287.025" height="52.594" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="45.822" y="637.87" fill="#151652" font-size="14" textLength="267.025" font-family="Ubuntu">On each server: remove User CA trust</text><text x="45.822" y="654.167" fill="#151652" font-size="14" textLength="170.311" font-family="Ubuntu">and auth_principals files</text><rect x="53.425" y="687.469" width="251.82" height="36.297" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="63.425" y="710.464" fill="#151652" font-size="14" textLength="231.82" font-family="Ubuntu">Test: a fleet certificate is refused</text><rect x="49.248" y="743.766" width="260.174" height="36.297" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="59.248" y="766.761" fill="#151652" font-size="14" textLength="240.174" font-family="Ubuntu">Offboard the hosts in PKI Manager</text><rect x="79.056" y="800.063" width="200.558" height="36.297" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="89.056" y="823.058" fill="#151652" font-size="14" textLength="180.558" font-family="Ubuntu">Stop issuing client-initech</text><path d="M210.335,858.359 L210.335,883.805 L190.335,887.805 L210.335,891.805 L210.335,917.25 A0,0 0 0 0 210.335,917.25 L509.304,917.25 A0,0 0 0 0 509.304,917.25 L509.304,868.359 L499.304,858.359 L210.335,858.359 A0,0 0 0 0 210.335,858.359" style="stroke:#F46524;stroke-width:0.5;" fill="#FFF4EC"/><path d="M499.304,858.359 L499.304,868.359 L509.304,868.359 L499.304,858.359" style="stroke:#F46524;stroke-width:0.5;" fill="#FFF4EC"/><text x="216.335" y="876.354" fill="#575757" font-size="14" textLength="253.128" font-family="Ubuntu">Must Acme reject everything signed</text><text x="216.335" y="892.651" fill="#575757" font-size="14" textLength="277.97" font-family="Ubuntu">for other customers? -> separate ZONE</text><text x="216.335" y="908.948" fill="#575757" font-size="14" textLength="144.307" font-family="Ubuntu">(own CAs, own KRL).</text><ellipse cx="179.335" cy="88