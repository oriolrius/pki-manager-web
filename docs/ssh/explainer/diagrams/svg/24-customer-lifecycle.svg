<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:495px;height:1061px;background:#FFFFFF;" width="495px" height="1061px" viewBox="0 0 495 1061" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="42.248" y="45.12" fill="#151652" font-size="22" textLength="408.827" font-weight="700" font-family="Ubuntu">Customers: onboard, move people, exit</text></g><ellipse cx="167.141" cy="79.278" rx="10" ry="10" fill="#151652" style="stroke:#222;stroke-width:1;"/><rect x="22.258" y="99.278" width="289.765" height="308.516" fill="#F4F4F4" style="stroke:#D5D6D7;stroke-width:1.5;" rx="5" ry="5"/><path d="M202.769,99.278 L202.769,116.364 L192.769,126.364 L22.258,126.364" style="stroke:#D5D6D7;stroke-width:1.5;" fill="none"/><text x="29.258" y="117.718" fill="#151652" font-size="14" textLength="162.511" font-family="Ubuntu">New customer (Umbrella)</text><rect x="53.209" y="143.364" width="227.863" height="44.086" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="67.209" y="170.804" fill="#151652" font-size="14" textLength="199.863" font-family="Ubuntu">Create principal client-umbrella</text><rect x="32.258" y="207.45" width="269.765" height="44.086" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="46.258" y="234.89" fill="#151652" font-size="14" textLength="241.765" font-family="Ubuntu">Map it on Umbrella's servers -> deploy</text><rect x="58.858" y="271.536" width="216.565" height="44.086" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="72.858" y="298.976" fill="#151652" font-size="14" textLength="188.565" font-family="Ubuntu">Deploy the files, Mark pushed</text><rect x="59.887" y="335.622" width="214.507" height="60.172" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="73.887" y="363.062" fill="#151652" font-size="14" textLength="186.507" font-family="Ubuntu">Add it to the NEXT certificate</text><text x="73.887" y="379.148" fill="#151652" font-size="14" textLength="183.539" font-family="Ubuntu">of the people on the account</text><rect x="16" y="417.794" width="302.281" height="228.344" fill="#F4F4F4" style="stroke:#D5D6D7;stroke-width:1.5;" rx="5" ry="5"/><path d="M205.443,417.794 L205.443,434.88 L195.443,444.88 L16,444.88" style="stroke:#D5D6D7;stroke-width:1.5;" fill="none"/><text x="23" y="436.234" fill="#151652" font-size="14" textLength="171.443" font-family="Ubuntu">Ana moves Acme -> Globex</text><rect x="26" y="461.88" width="282.281" height="44.086" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="40" y="489.32" fill="#151652" font-size="14" textLength="254.281" font-family="Ubuntu">Issue new cert: developers client-globex</text><rect x="58.746" y="525.966" width="216.789" height="44.086" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="72.746" y="553.405" fill="#151652" font-size="14" textLength="188.789" font-family="Ubuntu">Revoke the old cert (by serial)</text><rect x="30.676" y="590.051" width="272.929" height="44.086" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="44.676" y="617.491" fill="#151652" font-size="14" textLength="244.929" font-family="Ubuntu">Acme refuses it after the next KRL pull</text><rect x="24.365" y="656.137" width="285.551" height="308.516" fill="#F4F4F4" style="stroke:#D5D6D7;stroke-width:1.5;" rx="5" ry="5"/><path d="M246.918,656.137 L246.918,673.223 L236.918,683.223 L24.365,683.223" style="stroke:#D5D6D7;stroke-width:1.5;" fill="none"/><text x="31.365" y="674.577" fill="#151652" font-size="14" textLength="204.553" font-family="Ubuntu">Customer leaves with its servers</text><rect x="34.365" y="700.223" width="265.551" height="60.172" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="48.365" y="727.663" fill="#151652" font-size="14" textLength="237.551" font-family="Ubuntu">On each server: remove User CA trust</text><text x="48.365" y="743.749" fill="#151652" font-size="14" textLength="153.649" font-family="Ubuntu">and auth_principals files</text><rect x="48.673" y="780.395" width="236.935" height="44.086" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="62.673" y="807.835" fill="#151652" font-size="14" textLength="208.935" font-family="Ubuntu">Test: a fleet certificate is refused</text><rect x="43.15" y="844.481" width="247.981" height="44.086" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="57.15" y="871.921" fill="#151652" font-size="14" textLength="219.981" font-family="Ubuntu">Offboard the hosts in PKI Manager</text><rect x="71.934" y="908.567" width="190.413" height="44.086" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="85.934" y="936.007" fill="#151652" font-size="14" textLength="162.413" font-family="Ubuntu">Stop issuing client-initech</text><path d="M198.141,974.653 L198.141,1003.782 L178.141,1007.782 L198.141,1011.782 L198.141,1040.911 A0,0 0 0 0 198.141,1040.911 L474.324,1040.911 A0,0 0 0 0 474.324,1040.911 L474.324,984.653 L464.324,974.653 L198.141,974.653 A0,0 0 0 0 198.141,974.653" style="stroke:#F46524;stroke-width:0.5;" fill="#FFF4EC"/><path d="M464.324,974.653 L464.324,984.653 L474.324,984.653 L464.324,974.653" style="stroke:#F46524;stroke-width:0.5;" fill="#FFF4EC"/><text x="208.141" y="997.093" fill="#575757" font-size="14" textLength="227.765" font-family="Ubuntu">Must Acme reject everything signed</text><text x="208.141" y="1013.179" fill="#575757" font-size="14" textLength="247.183" font-family="Ubuntu">for other customers? -> separate ZONE</text><text x="208.141" y="1029.265" fill="#575757" font-size="14" textLength="129.094" font-family="Ubuntu">(own CAs, own KRL).</text><ellipse cx="167.141" cy="1007.782