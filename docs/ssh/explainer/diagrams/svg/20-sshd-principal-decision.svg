ill="#000" font-size="10" textLength="535.825" font-family="monospace">This syntax is deprecated, you must add &lt;&lt;#FDECEC>> at the end of the line, after the ';'</text><ellipse cx="366.419" cy="209.122" rx="10" ry="10" fill="#151652" style="stroke:#222;stroke-width:1;"/><rect x="249.485" y="239.122" width="233.869" height="60.172" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="263.485" y="266.562" fill="#151652" font-size="14" textLength="205.869" font-family="Ubuntu">Client presents a user certificate</text><text x="263.485" y="282.648" fill="#151652" font-size="14" textLength="72.59" font-family="Ubuntu">for account</text><text x="339.308" y="282.648" fill="#151652" font-size="14" textLength="45.668" font-weight="700" font-family="Ubuntu">deploy</text><rect x="329.69" y="372.274" width="73.458" height="44.086" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="343.69" y="399.714" fill="#151652" font-size="14" textLength="45.458" font-family="Ubuntu">Denied</text><ellipse cx="366.419" cy="450.795" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="366.419" cy="450.795" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="268.221,319.294,464.618,319.294,476.618,331.337,464.618,343.38,268.221,343.38,256.221,331.337,268.221,319.294" fill="#F4F4F4" style="stroke:#54595F;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="374.419" y="358.9" fill="#54595F" font-size="12" textLength="18.024" font-family="Ubuntu">yes</text><text x="272.221" y="336.734" fill="#151652" font-size="14" textLength="188.397" font-family="Ubuntu">Serial or key in revoked_keys?</text><rect x="252.684" y="556.775" width="227.471" height="44.086" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="266.684" y="584.215" fill="#151652" font-size="14" textLength="199.471" font-family="Ubuntu">Denied (not from your User CA)</text><ellipse cx="366.419" cy="635.297" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="366.419" cy="635.297" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="252.744,503.795,480.095,503.795,492.095,515.838,480.095,527.881,252.744,527.881,240.744,515.838,252.744,503.795" fill="#F4F4F4" style="stroke:#54595F;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="374.419" y="543.401" fill="#54595F" font-size="12" textLength="13.968" font-family="Ubuntu">no</text><text x="256.744" y="521.235" fill="#151652" font-size="14" textLength="219.351" font-family="Ubuntu">Signed by a key in ssh-user-ca.pub?</text><rect x="254.119" y="741.277" width="224.601" height="44.086" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="268.119" y="768.717" fill="#151652" font-size="14" textLength="196.601" font-family="Ubuntu">Denied (expired / not yet valid)</text><ellipse cx="366.419" cy="819.798" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="366.419" cy="819.798" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="268.354,688.297,464.485,688.297,476.485,700.34,464.485,712.383,268.354,712.383,256.354,700.34,268.354,688.297" fill="#F4F4F4" style="stroke:#54595F;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="374.419" y="727.903" fill="#54595F" font-size="12" textLength="13.968" font-family="Ubuntu">no</text><text x="272.354" y="705.737" fill="#151652" font-size="14" textLength="188.131" font-family="Ubuntu">Now inside the validity dates?</text><rect x="233.273" y="925.778" width="266.293" height="44.086" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="247.273" y="953.218" fill="#151652" font-size="14" textLength="238.293" font-family="Ubuntu">Denied: account closed to certificates</text><ellipse cx="366.419" cy="1004.3" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="