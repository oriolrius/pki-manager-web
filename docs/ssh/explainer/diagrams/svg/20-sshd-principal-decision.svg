u">yes</text><text x="272.221" y="206.89" fill="#151652" font-size="14" textLength="188.397" font-family="Ubuntu">Serial or key in revoked_keys?</text><rect x="252.684" y="426.931" width="227.471" height="44.086" fill="#FDECEC" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="266.684" y="454.371" fill="#151652" font-size="14" textLength="199.471" font-family="Ubuntu">Denied (not from your User CA)</text><ellipse cx="366.419" cy="505.453" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="366.419" cy="505.453" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="252.744,373.951,480.095,373.951,492.095,385.994,480.095,398.037,252.744,398.037,240.744,385.994,252.744,373.951" fill="#F4F4F4" style="stroke:#54595F;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="374.419" y="413.557" fill="#54595F" font-size="12" textLength="13.968" font-family="Ubuntu">no</text><text x="256.744" y="391.391" fill="#151652" font-size="14" textLength="219.351" font-family="Ubuntu">Signed by a key in ssh-user-ca.pub?</text><rect x="254.119" y="611.433" width="224.601" height="44.086" fill="#FDECEC" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="268.119" y="638.873" fill="#151652" font-size="14" textLength="196.601" font-family="Ubuntu">Denied (expired / not yet valid)</text><ellipse cx="366.419" cy="689.954" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="366.419" cy="689.954" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="268.354,558.453,464.485,558.453,476.485,570.496,464.485,582.539,268.354,582.539,256.354,570.496,268.354,558.453" fill="#F4F4F4" style="stroke:#54595F;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="374.419" y="598.059" fill="#54595F" font-size="12" textLength="13.968" font-family="Ubuntu">no</text><text x="272.354" y="575.893" fill="#151652" font-size="14" textLength="188.131" fo