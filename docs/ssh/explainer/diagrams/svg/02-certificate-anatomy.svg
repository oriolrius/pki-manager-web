<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:796px;height:664px;background:#FFFFFF;" width="796px" height="664px" viewBox="0 0 796 664" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="199.37" y="35.12" fill="#151652" font-size="22" textLength="390.259" font-weight="700" font-family="Ubuntu">What is inside an SSH user certificate</text></g><!--cluster cert--><g class="cluster" data-qualified-name="cert" id="ent0001" data-source-line="4"><rect x="352" y="61.278" width="430" height="589" fill="#F4F4F4" style="stroke:#54595F;stroke-width:1.4;" rx="5" ry="5"/><text x="498.722" y="80.718" fill="#151652" font-size="14" textLength="136.555" font-weight="700" font-family="Ubuntu">id_ed25519-cert.pub</text></g><!--entity k--><g class="entity" data-qualified-name="cert.k" id="ent0002" data-source-line="5"><rect x="462" y="104.278" width="209.901" height="60.172" fill="#FFF" style="stroke:#151652;stroke-width:1.4;" rx="5" ry="5"/><text x="476" y="131.718" fill="#151652" font-size="14" textLength="63.994" font-family="Ubuntu">Public key</text><text x="476" y="147.804" fill="#151652" font-size="14" textLength="181.901" font-family="Ubuntu">(Alice's normal ed25519 key)</text></g><!--entity id--><g class="entity" data-qualified-name="cert.id" id="ent0003" data-source-line="6"><rect x="462.5" y="206.278" width="208.935" height="60.172" fill="#FFF" style="stroke:#151652;stroke-width:1.4;" rx="5" ry="5"/><text x="476.5" y="233.718" fill="#151652" font-size="14" textLength="180.935" font-family="Ubuntu">Key ID: alice@acme.example</text><text x="476.5" y="249.804" fill="#151652" font-size="14" textLength="57.82" font-family="Ubuntu">Serial: 42</text></g><!--entity pr--><g class="entity" data-qualified-name="cert.pr" id="ent0004" data-source-line="7"><rect x="483.5" y="306.278" width="166.571" height="44.086" fill="#F60" style="stroke:#C95000;stroke-width:1.4;" rx="5" ry="5"/><text x="497.5" y="333.718" fill="#FFF" font-size="14" textLength="138.571" font-family="Ubuntu">Principals: developers</text></g><!--entity v--><g class="entity" data-qualified-name="cert.v" id="ent0005" data-source-line="8"><rect x="470" y="390.278" width="194.347" height="44.086" fill="#FFF" style="stroke:#151652;stroke-width:1.4;" rx="5" ry="5"/><text x="484" y="417.718" fill="#151652" font-size="14" textLength="166.347" font-family="Ubuntu">Valid: 7 days (from ... to ...)</text></g><!--entity ext--><g class="entity" data-qualified-name="cert.ext" id="ent0006" data-source-line="9"><rect x="367.5" y="474.278" width="398.691" height="60.172" fill="#FFF" style="stroke:#151652;stroke-width:1.4;" rx="5" ry="5"/><text x="381.5" y="501.718" fill="#151652" font-size="14" textLength="316.231" font-family="Ubuntu">Extensions: permit-pty, permit-port-forwarding, ...</text><text x="381.5" y="517.804" fill="#151652" font-size="14" textLength="370.691" font-family="Ubuntu">Critical options: force-command, source-address (optional)</text></g><!--entity sig--><g class="entity" data-qualified-name="cert.sig" id="ent0007" data-source-line="10"><rect x="475" y="574.278" width="184.435" height="60.172" fill="#F60" style="stroke:#C95000;stroke-width:1.4;" rx="5" ry="5"/><text x="489" y="601.718" fill="#FFF" font-size="14" textLength="156.435" font-family="Ubuntu">Signature of the User CA</text><text x="489" y="617.804" fill="#FFF" font-size="14" textLength="126.924" font-family="Ubuntu">over all fields above</text></g><g class="entity" data-qualified-name="N1" id="ent0013" data-source-line="18"><path d="M6,107.278 L6,161.45 A5,5 0 0 0 11,166.45 L330.999,166.45 A5,5 0 0 0 335.999,161.45 L335.999,112.278 L325.999,102.278 L11,102.278 A5,5 0 0 0 6,107.278" style="stroke:#F46524;stroke-width:0.5;" fill="#FFF4EC"/><path d="M325.999,102.278 L325.999,109.778 A2.5,2.5 0 0 0 328.499,112.278 L335.999,112.278 L325.999,102.278" style="stroke:#F46524;stroke-width:1;" fill="#FFF4EC"/><text x="16" y="124.718" fill="#575757" font-size="14" textLength="79.31" font-family="Ubuntu">Read it with:</text><text x="16" y="138.984" fill="#575757" font-size="14" textLength="300.999" font-family="'Ubuntu Mono'">ssh-keygen -L -f ~/.ssh/id_ed25519-cert.pub</text><text x="16" y="154.804" fill="#575757" font-size="14" textLength="271.053" font-family="Ubuntu">Change one byte and the signature breaks.</text></g><!--link k to id--><!--link id to pr--><!--link pr to v--><!--link v to ext--><!--link ext to sig--><?plantuml-src RL9XYzD04FsUNp56qBCqELeynNeKZofuA8TOr0zMP9gT94Ctks5tapQ8__rcKpbjyKF8xCoyDs_UxYCsXUuKGQYfeSmwjjfnv_EsQtGIE6Y2RpK6O0ziF4id6bYltqFdoK51Bd391GPA4aT5G5C98frCMFqaDR-wchtAOfFmRIUJ5D2F6BY-BbdJSWc_4e1_W9-whUO2TZHipCMDXFJKWx6kGGr_-6BnsSYqEyL-e05ktou08-mD5WtbTC2crRGnQtACUW7FvoEIrTbO9pvmYzelG55FshRa_DZQEX4RbrqkJp5VPOvQm4jGE7YuA9rj8Czp23R-ZWhxKyYxGo0nqHeP8mCQ3baRXkb3R5t8Iklsw1IRQXfvDcRbE8Z36cmRZb1fAIWhRDEWKLFmjejdLCgH5oN7FjH72NG8foBMN1aCdIEmPRns-19lSdMpCRQN0BM6aaah3xYLp4ZYkVhhmkza1zdtcfKYyqFPlScYdwpEawrBnBopP9_qvwceKBxpjCnCZ0qKvz_DP8VFX0eum9v3lP1pcdfVP_8QAZAGVOIiX2UFP_CNhozpALp-vmMcgS1MjHWXonk2xH3fZHfjy0--R1tXpkS9IIKgk0S0?></g></svg>