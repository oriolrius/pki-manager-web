<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:831px;height:604px;background:#FFFFFF;" width="831px" height="604px" viewBox="0 0 831 604" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="177"><text x="177.999" y="30.421" fill="#151652" font-size="22" textLength="468.832" font-weight="700" font-family="Ubuntu">What is inside an SSH user certificate</text></g><!--cluster cert--><g class="cluster" data-qualified-name="cert" id="ent0001" data-source-line="179"><rect x="353.83" y="53.609" width="464" height="537.12" fill="#F4F4F4" style="stroke:#54595F;stroke-width:1.4;" rx="5" ry="5"/><text x="504.544" y="68.604" fill="#151652" font-size="14" textLength="162.572" font-weight="700" font-family="Ubuntu">id_ed25519-cert.pub</text></g><!--entity k--><g class="entity" data-qualified-name="cert.k" id="ent0002" data-source-line="180"><rect x="473.12" y="88.609" width="225.427" height="52.594" fill="#FFF" style="stroke:#151652;stroke-width:1.4;" rx="5" ry="5"/><text x="483.12" y="111.604" fill="#151652" font-size="14" textLength="71.135" font-family="Ubuntu">Public key</text><text x="483.12" y="127.901" fill="#151652" font-size="14" textLength="205.427" font-family="Ubuntu">(Alice's normal ed25519 key)</text></g><!--entity id--><g class="entity" data-qualified-name="cert.id" id="ent0003" data-source-line="181"><rect x="473.45" y="184.349" width="224.757" height="52.594" fill="#FFF" style="stroke:#151652;stroke-width:1.4;" rx="5" ry="5"/><text x="483.45" y="207.344" fill="#151652" font-size="14" textLength="204.757" font-family="Ubuntu">Key ID: alice@acme.example</text><text x="483.45" y="223.641" fill="#151652" font-size="14" textLength="66.596" font-family="Ubuntu">Serial: 42</text></g><!--entity pr--><g class="entity" data-qualified-name="cert.pr" id="ent0004" data-source-line="182"><rect x="498.95" y="276.949" width="173.768" height="36.297" fill="#F60" style="stroke:#C95000;stroke-width:1.4;" rx="5" ry="5"/><text x="508.95" y="299.944" fill="#FFF" font-size="14" textLength="153.768" font-family="Ubuntu">Principals: developers</text></g><!--entity v--><g class="entity" data-qualified-name="cert.v" id="ent0005" data-source-line="183"><rect x="479.45" y="353.249" width="212.76" height="36.297" fill="#FFF" style="stroke:#151652;stroke-width:1.4;" rx="5" ry="5"/><text x="489.45" y="376.244" fill="#151652" font-size="14" textLength="192.76" font-family="Ubuntu">Valid: 7 days (from ... to ...)</text></g><!--entity ext--><g class="entity" data-qualified-name="cert.ext" id="ent0006" data-source-line="184"><rect x="369.43" y="429.539" width="432.809" height="52.594" fill="#FFF" style="stroke:#151652;stroke-width:1.4;" rx="5" ry="5"/><text x="379.43" y="452.534" fill="#151652" font-size="14" textLength="350.971" font-family="Ubuntu">Extensions: permit-pty, permit-port-forwarding, ...</text><text x="379.43" y="468.831" fill="#151652" font-size="14" textLength="412.809" font-family="Ubuntu">Critical options: force-command, source-address (optional)</text></g><!--entity sig--><g class="entity" data-qualified-name="cert.sig" id="ent0007" data-source-line="185"><rect x="489.14" y="522.139" width="193.38" height="52.594" fill="#F60" style="stroke:#C95000;stroke-width:1.4;" rx="5" ry="5"/><text x="499.14" y="545.134" fill="#FFF" font-size="14" textLength="173.38" font-family="Ubuntu">Signature of the User CA</text><text x="499.14" y="561.431" fill="#FFF" font-size="14" textLength="141.36" font-family="Ubuntu">over all fields above</text></g><g class="entity" data-qualified-name="N1" id="ent0013" data-source-line="193"><path d="M6,90.459 L6,139.35 A5,5 0 0 0 11,144.35 L332.666,144.35 A5,5 0 0 0 337.666,139.35 L337.666,95.459 L327.666,85.459 L11,85.459 A5,5 0 0 0 6,90.459" style="stroke:#F46524;stroke-width:0.5;" fill="#FFF4EC"/><path d="M327.666,85.459 L327.666,92.959 A2.5,2.5 0 0 0 330.166,95.459 L337.666,95.459 L327.666,85.459" style="stroke:#F46524;stroke-width:1;" fill="#FFF4EC"/><text x="12" y="103.454" fill="#575757" font-size="14" textLength="88.505" font-family="Ubuntu">Read it with:</text><text x="12" y="119.751" fill="#575757" font-size="14" textLength="310.666" font-family="'Ubuntu Mono'">ssh-keygen -L -f ~/.ssh/id_ed25519-cert.pub</text><text x="12" y="136.048" fill="#575757" font-size="14" textLength="304.883" font-family="Ubuntu">Change one byte and the signature breaks.</text></g><!--link k to id--><!--link id to pr--><!--link pr to v--><!--link v to ext--><!--link ext to sig--><?plantuml-src hLXjSnet4FxEhzX2fyOU8400lpJD56D8Cd5SZqdIwTITZBWJeE5Ekae2ctRok_gzlwmhtGkwu_0qQSq7t-tBiwlTbLPxHt0R4Au_lBi6lQGXlG0XcGWaMwjMI1im5z8mO3fz3QCXqCSe88nJsQeSmIq9gDOKwguAFDiXXBIf0kRJJTDY7r-W4W0dcotKEltEeD-5l_-oxqsVqWXgxN5xydneY48Ilg1Gcqm6WtPxHsaoleBQwBpVRhSjsa9IocDgUtHsEh2oCN4csMAfeVPyDBeyFpDq5H3qjzRlzS_x4qEO2HzzwP-QduKBcKADIS_yZC2IC1dWWg5srRyQN9qQccySaUZ5e7lMFOCwbL98XGkNT2CyefdW87YmFKR4YU1QNS27sPhhDTGrVTJ7ZVJrdU02wfxmwR69vvI6c0hcWT9KKg6t4LLGLmI3web0h2KOKI3APcI3WHL9I5-yM2igNxx4H_Y0JoPLXFjWgE1HgTcSeMC6BWxZSQAs54h7Qg_nALKpr8AQZMYg5H9lYJ51HSJVKAaQ4918YmW5JJPJkJaBQ8nkdfJ5zWIVimKkowGY5OnMB9Q3sxTlu1tXn0JOOe5OQvE0HbeInFCerwbcd0kZl0j-0vACr2NrZI26v0A-OTmBrXW_MulDNSr6wp2eLDIAyOX84iACUAk556lkZp3gqjIW-NCaV3edwq2RtDwOxCJfB1UOiZyeT7hbpCH0Kdzx8gO-L4GywcUcgaxfL1qDjII-U61y0NCIAEfmx4ey8N7JGgVjC3WMay9TzzmbOenNXjXpYUZ22ZCorTk0OfmzZK4FN1kU22F1CIr5aIKMgLFEyJiD8xt5DIfFiiWap8t-45FtaCR5xjCYy_sIUIjEbO9EQr1a7iv9neupqYrZvUqw4fffNDUV5O2YWPXYCRlTzCr6OIO2Fo4akF6PL_diHexO26JGgNCvlTEX-Q7UVawiukLUnThpot24zAbCgF49bb7TE7PB7NLTwk-lpLt7N9gOb3iJRvz3pXmqwnfoApGjhY-nbY7lBxrNwiC-T7R69ZqfRsB7JNgJ0-fgMkVAm9EJE6bYHV2CEpmTzS_ou2dl2V3TWLsCnBv0t8Fp9Xps4rQIuxwq-dRSP7Fby5FU4y6FMqHfUXrcBZ5PbbE1RZxPcTuJPhF-KfjSZKVZKT7oZX_V1lBuE-xPk7FPkSnNibdrb-pV_SWvHqhkODU7DqUlk0PZ3I4Aso1fIUuM3-Y2OWF_cWEd3DXUU7vVK-vHy1bPe0dbDhIKP-oLD0M0QpQdrrYLvIOpxa5NRmbU