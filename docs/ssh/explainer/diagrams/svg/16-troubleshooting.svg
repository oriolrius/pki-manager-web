.977" y="118.456" fill="#151652" font-size="14" textLength="283.726" font-family="Ubuntu">Fingerprint prompt or host key warning?</text><text x="359.703" y="110.779" fill="#54595F" font-size="12" textLength="14.947" font-family="Ubuntu">no</text><rect x="37.578" y="352.469" width="336.524" height="36.297" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="47.578" y="375.464" fill="#151652" font-size="14" textLength="155.538" font-family="'Ubuntu Mono'">/etc/ssh/revoked_keys</text><text x="207.566" y="375.464" fill="#151652" font-size="14" textLength="156.536" font-family="Ubuntu">missing or unreadable</text><ellipse cx="205.84" cy="427.117" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="205.84" cy="427.117" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="86.091,303.484,325.588,303.484,337.588,315.484,325.588,327.484,86.091,327.484,74.091,315.484,86.091,303.484" fill="#F4F4F4" style="stroke:#54595F;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="209.84" y="338.623" fill="#54595F" font-size="12" textLength="20.736" font-family="Ubuntu">yes</text><text x="86.091" y="320.331" fill="#151652" font-size="14" textLength="239.497" font-family="Ubuntu">Every key login fails, for all users?</text><text x="337.588" y="312.654" fill="#54595F" font-size="12" textLength="14.947" font-family="Ubuntu">no</text><rect x="63.838" y="529.102" width="284.004" height="36.297" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="73.838" y="552.097" fill="#151652" font-size="14" textLength="264.004" font-family="Ubuntu">Fix NTP / chrony on server and laptop</text><ellipse cx="205.84" cy="603.75" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="205.84" cy="603.75" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="79.953,480.117,331.727,480.117,343.727,492.117,331.727,504.117,79.953,504.117,67.953,49