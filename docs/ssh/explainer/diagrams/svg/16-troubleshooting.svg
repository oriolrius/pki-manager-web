-linejoin:miter;stroke-miterlimit:10;"/><text x="209.84" y="691.889" fill="#54595F" font-size="12" textLength="20.736" font-family="Ubuntu">yes</text><text x="57.763" y="673.597" fill="#151652" font-size="14" textLength="296.153" font-family="Ubuntu">Permission denied with a valid certificate?</text><text x="365.917" y="665.92" fill="#54595F" font-size="12" textLength="14.947" font-family="Ubuntu">no</text><rect x="44.01" y="891.219" width="323.659" height="52.594" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="54.01" y="914.214" fill="#151652" font-size="14" textLength="41.248" font-family="'Ubuntu Mono'">ssh -v</text><text x="99.708" y="914.214" fill="#151652" font-size="14" textLength="109.792" font-family="Ubuntu">on the laptop +</text><text x="54.01" y="930.511" fill="#151652" font-size="14" textLength="111.788" font-family="'Ubuntu Mono'">journalctl -u ssh</text><text x="170.249" y="930.511" fill="#151652" font-size="14" textLength="187.421" font-family="Ubuntu">(RHEL: sshd) on the server</text><ellipse cx="205.84" cy="974.813" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="205.84" cy="974.813" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="205.84" y1="219.484" x2="205.84" y2="239.484" style="stroke:#54595F;stroke-width:1.6;"/><polygon points="201.84,229.484,205.84,239.484,209.84,229.484,205.84,233.484" fill="#54595F" style="stroke:#54595F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="205.84" y1="125.609" x2="205.84" y2="150.594" style="stroke:#54595F;stroke-width:1.6;"/><polygon points="201.84,140.594,205.84,150.594,209.84,140.594,205.84,144.594" fill="#54595F" style="stroke:#54595F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="359.703" y1="113.609" x2="405.68" y2="113.609" style="stroke:#54595F;stroke-width:1.6;"/><polygon points="401.68,200.539,405.68,210.539,409.68,200.539,405.68,204.539" fill="#54595F" style="stroke:#545