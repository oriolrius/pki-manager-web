<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:414px;height:1059px;background:#FFFFFF;" width="414px" height="1059px" viewBox="0 0 414 1059" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="89.056" y="45.12" fill="#151652" font-size="22" textLength="234.345" font-weight="700" font-family="Ubuntu">Login troubleshooting</text></g><ellipse cx="192.728" cy="79.278" rx="10" ry="10" fill="#151652" style="stroke:#222;stroke-width:1;"/><rect x="16" y="162.258" width="353.457" height="76.258" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="30" y="189.698" fill="#151652" font-size="14" textLength="220.653" font-family="Ubuntu">Laptop does not trust the Host CA:</text><text x="30" y="205.784" fill="#151652" font-size="14" textLength="36.148" font-family="Ubuntu">check</text><text x="69.382" y="206.05" fill="#151652" font-size="14" textLength="105" font-family="'Ubuntu Mono'">@cert-authority</text><text x="177.615" y="205.784" fill="#151652" font-size="14" textLength="89.11" font-family="Ubuntu">line + pattern,</text><text x="30" y="221.87" fill="#151652" font-size="14" textLength="325.457" font-family="Ubuntu">connect with the exact FQDN in the host certificate</text><ellipse cx="192.728" cy="269.516" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="192.728" cy="269.516" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="60.671,109.278,324.786,109.278,336.786,121.321,324.786,133.364,60.671,133.364,48.671,121.321,60.671,109.278" fill="#F4F4F4" style="stroke:#54595F;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="200.728" y="148.884" fill="#54595F" font-size="12" textLength="18.024" font-family="Ubuntu">yes</text><text x="64.671" y="126.718" fill="#151652" font-size="14" textLength="256.115" font-family="Ubuntu">Fingerprint prompt or host key warning?</text><text x="340.786" y="115.053" fill="#54595F" font-size="12" textLength="13.968" font-family="Ubuntu">no</text><rect x="33.64" y="375.496" width="318.177" height="44.086" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="47.64" y="403.202" fill="#151652" font-size="14" textLength="146.999" font-family="'Ubuntu Mono'">/etc/ssh/revoked_keys</text><text x="197.873" y="402.936" fill="#151652" font-size="14" textLength="139.943" font-family="Ubuntu">missing or unreadable</text><ellipse cx="192.728" cy="454.017" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="192.728" cy="454.017" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="82.903,322.516,302.554,322.516,314.554,334.559,302.554,346.602,82.903,346.602,70.903,334.559,82.903,322.516" fill="#F4F4F4" style="stroke:#54595F;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="200.728" y="362.122" fill="#54595F" font-size="12" textLength="18.024" font-family="Ubuntu">yes</text><text x="86.903" y="339.956" fill="#151652" font-size="14" textLength="211.651" font-family="Ubuntu">Every key login fails, for all users?</text><text x="318.554" y="328.291" fill="#54595F" font-size="12" textLength="13.968" font-family="Ubuntu">no</text><rect x="60.163" y="559.997" width="265.131" height="44.086" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="74.163" y="587.437" fill="#151652" font-size="14" textLength="237.131" font-family="Ubuntu">Fix NTP / chrony on server and laptop</text><ellipse cx="192.728" cy="638.519" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="192.728" cy="638.519" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="76.589,507.017,308.868,507.017,320.868,519.06,308.868,531.103,76.589,531.103,64.589,519.06,76.589,507.017" fill="#F4F4F4" style="stroke:#54595F;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="200.728" y="546.623" fill="#54595F" font-size="12" textLength="18.024" font-family="Ubuntu">yes</text><text x="80.589" y="524.457" fill="#151652" font-size="14" textLength="224.279" font-family="Ubuntu">Time errors: expired / not yet valid?</text><text x="324.868" y="512.792" fill="#54595F" font-size="12" textLength="13.968" font-family="Ubuntu">no</text><rect x="56.18" y="744.499" width="273.097" height="108.43" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="70.18" y="771.939" fill="#151652" font-size="14" textLength="196.531" font-family="Ubuntu">Principal missing on the server:</text><text x="70.18" y="788.025" fill="#151652" font-size="14" textLength="55.608" font-family="Ubuntu">compare</text><text x="129.022" y="788.291" fill="#151652" font-size="14" textLength="91" font-family="'Ubuntu Mono'">ssh-keygen -L</text><text x="223.255" y="788.025" fill="#151652" font-size="14" textLength="28.042" font-family="Ubuntu">with</text><text x="70.18" y="804.377" fill="#151652" font-size="14" textLength="223.999" font-family="'Ubuntu Mono'">/etc/ssh/auth_principals/ACCOUNT</text><text x="294.179" y="804.111" fill="#151652" font-size="14" font-family="Ubuntu">.</text><text x="70.18" y="820.196" fill="#151652" font-size="14" textLength="245.097" font-family="Ubuntu">if the host shows Stale: deploy the file,</text><text x="70.18" y="836.282" fill="#151652" font-size="14" textLength="145.683" font-family="Ubuntu">then click Mark pushed</text><ellipse cx="192.728" cy="883.928" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="192.728" cy="883.928" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="55.911,691.519,329.546,691.519,341.546,703.562,329.546,715.605,55.911,715.605,43.911,703.562,55.911,691.519" fill="#F4F4F4" style="stroke:#54595F;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="200.728" y="731.125" fill="#54595F" font-size="12" textLength="18.024" font-family="Ubuntu">yes</text><text x="59.911" y="708.959" fill="#151652" font-size="14" textLength="265.635" font-family="Ubuntu">Permission denied with a valid certificate?</text><text x="345.546" y="697.294" fill="#54595F" font-size="12" textLength="13.968" font-family="Ubuntu">no</text><rect x="34.816" y="936.928" width="315.825" height="60.172" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="48.816" y="964.634" fill="#151652" font-size="14" textLength="42" font-family="'Ubuntu Mono'">ssh -v</text><text x="94.05" y="964.368" fill="#151652" font-size="14" textLength="96.852" font-family="Ubuntu">on the laptop +</text><text x="48.816" y="980.72" fill="#151652" font-size="14" textLength="118.999" font-family="'Ubuntu Mono'">journalctl -u ssh</text><text x="171.049" y="980.454" fill="#151652" font-size="14" textLength="165.591" font-family="Ubuntu">(RHEL: sshd) on the server</text><ellipse cx="192.728" cy="1028.1" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="192.728" cy="1028.1" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="192.728" y1="238.516" x2="192.728" y2="258.516" style="stroke:#54595F;stroke-width:1.6;"/><polygon points="188.728,248.516,192.728,258.516,196.728,248.516,192.728,252.516" fill="#54595F" style="stroke:#54595F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="192.728" y1="133.364" x2="192.728" y2="162.258" style="stroke:#54595F;stroke-width:1.6;"/><polygon points="188.728,152.258,192.728,162.258,196.728,152.258,192.728,156.258" fill="#54595F" style="stroke:#54595F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="336.786" y1="121.321" x2="379.457" y2="121.321" style="stroke:#54595F;stroke-width:1.6;"/><polygon points="375.457,215.865,379.457,225.865,383.457,215.865,379.457,219.865" fill="#54595F" style