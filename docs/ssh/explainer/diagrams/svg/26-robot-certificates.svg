#54595F" font-size="12" textLength="190.717" font-family="Ubuntu">check the job, pick ITS principal</text><polygon points="659.61,225.047,669.61,229.047,659.61,233.047,663.61,229.047" fill="#54595F" style="stroke:#54595F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="402.726" y1="229.047" x2="665.61" y2="229.047" style="stroke:#54595F;stroke-width:1.6;"/><text x="409.726" y="210.248" fill="#54595F" font-size="12" textLength="12.908" font-weight="700" font-family="Ubuntu">3.</text><text x="426.634" y="196.279" fill="#54595F" font-size="12" textLength="227.977" font-family="Ubuntu">sign-user · principals [acme-deployer]</text><text x="426.634" y="210.248" fill="#54595F" font-size="12" textLength="214.635" font-family="Ubuntu">validForSeconds 900 · extensions []</text><text x="426.634" y="224.217" fill="#54595F" font-size="12" textLength="217.846" font-family="Ubuntu">forceCommand /usr/local/bin/deploy</text><polygon points="413.726,253.016,403.726,257.016,413.726,261.016,409.726,257.016" fill="#54595F" style="stroke:#54595F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="407.726" y1="257.016" x2="670.61" y2="257.016" style="stroke:#54595F;stroke-width:1.6;stroke-dasharray:2,2;"/><text x="419.726" y="252.186" fill="#54595F" font-size="12" textLength="12.908" font-weight="700" font-family="Ubuntu">4.</text><text x="436.634" y="252.186" fill="#54595F" font-size="12" textLength="115.441" font-family="Ubuntu">certificate (15 min)</text><polygon points="84.759,280.984,74.759,284.984,84.759,288.984,80.759,284.984" fill="#54595F" style="stroke:#54595F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="78.759" y1="284.984" x2="401.726" y2="284.984" style="stroke:#54595F;stroke-width:1.6;stroke-dasharray:2,2;"/><text x="90.759" y="280.154" fill="#54595F" font-size="12" textLength="12.908" font-weight="700" font-family="Ubuntu">5.</text><text x="107.667" y="280.154" fill="#54595F" font-size="12" textLength="288.059" font-family="Ubuntu">certificate only (token never leaves the service)</text><polygon points="841.052,308.953,851.052,312.953,841.052,316.953,845.052,312.953" fill="#54595F" style="stroke:#54595F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="73.759" y1="312.953" x2="847.052" y2="312.953" style="stroke:#54595F;stroke-width:1.6;"/><text x="80.759" y="308.123" fill="#54595F" font-size="12" textLength="12.908" font-weight="700" font-family="Ubuntu">6.</text><text x="97.667" y="308.123" fill="#54595F" font-size="12" textLength="138.486" font-family="Ubuntu">ssh deploy@acme-web</text><line x1="853.052" y1="354.891" x2="895.052" y2="354.891" style="stroke:#54595F;stroke-width:1.6;"/><line x1="895.052" y1="354.891" x2="895.052" y2="367.891" style="stroke:#54595F;stroke-width:1.6;"/><line x1="854.052" y1="367.891" x2="895.052" y2="367.891" style="stroke:#54595F;stroke-width:1.6;"/><polygon points="864.052,363.891,854.052,367.891,864.052,371.891,860.052,367.891" fill="#54595F" style="stroke:#54595F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="860.052" y="343.076" fill="#54595F" font-size="12" textLength="12.908" font-weight="700" font-family="Ubuntu">7.</text><text x="876.96" y="336.092" fill="#54595F" font-size="12" textLength="241.354" font-family="Ubuntu">deploy file has acme-deployer -> match</text><text x="876.96" y="350.061" fill="#54595F" font-size="12" textLength="268.998" font-family="Ubuntu">forced command runs, no pty, no forwarding</text><path d="M295.76,385.891 L295.76,417.891 A5,5 0 0 0 300.76,422.891 L772.76,422.891 A5,5 0 0 0 777.76,417.891 L777.76,390.891 L767.76,380.891 L300.76,380.891 A5,5 0 0 0 295.76,385.891" style="stroke:#F46524;stroke-width:0.5;" fill="#FFF4EC"/><path d="M767.76,380.891 L767.76,388.391 A2.5,2.5 0 0 0 770.26,390.891 L777.76,390.891 L767.76,380.891" style="stroke:#F46524;stroke-width:0.5;" fill="#FFF4EC"/><text x="350.466" y="398.886" fill="#575757" font-size="14" textLength="364.403"