<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:601px;height:518px;background:#FFFFFF;" width="601px" height="518px" viewBox="0 0 601 518" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="224.913" y="35.12" fill="#151652" font-size="22" textLength="144.958" font-weight="700" font-family="Ubuntu">Rotating a CA</text></g><rect x="21" y="121.278" width="163.809" height="50.172" fill="#E7F6F0" style="stroke:#0C8760;stroke-width:0.5;" rx="5" ry="5"/><text x="30" y="143.718" fill="#151652" font-size="14" textLength="37.842" font-family="Ubuntu">active</text><text x="30" y="159.804" fill="#151652" font-size="14" textLength="145.809" font-family="Ubuntu">(signs new certificates)</text><rect x="7" y="256.278" width="192.033" height="50.172" fill="#FFF4EC" style="stroke:#C95000;stroke-width:0.5;" rx="5" ry="5"/><text x="16" y="278.718" fill="#151652" font-size="14" textLength="51.898" font-family="Ubuntu">rotating</text><text x="16" y="294.804" fill="#151652" font-size="14" textLength="174.033" font-family="Ubuntu">(still trusted, signs nothing)</text><rect x="34" y="391.278" width="138.288" height="50.172" fill="#FDECEC" style="stroke:#C62828;stroke-width:0.5;" rx="5" ry="5"/><text x="43" y="413.718" fill="#151652" font-size="14" textLength="43.876" font-family="Ubuntu">retired</text><text x="43" y="429.804" fill="#151652" font-size="14" textLength="120.288" font-family="Ubuntu">(no longer trusted)</text><g class="start_entity" data-qualified-name=".start." id="ent0004" data-source-line="4"><ellipse cx="103" cy="70.278" rx="10" ry="10" fill="#151652" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0008" data-source-line="10"><ellipse cx="103" cy="493.278" rx="11" ry="11" fill="none" style=