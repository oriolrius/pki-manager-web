<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:639px;height:472px;background:#FFFFFF;" width="639px" height="472px" viewBox="0 0 639 472" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="177"><text x="231.223" y="30.421" fill="#151652" font-size="22" textLength="170.221" font-weight="700" font-family="Ubuntu">Rotating a CA</text></g><rect x="22.17" y="113.609" width="172.935" height="42.594" fill="#E7F6F0" style="stroke:#0C8760;stroke-width:0.5;" rx="5" ry="5"/><text x="27.17" y="131.604" fill="#151652" font-size="14" textLength="42.554" font-family="Ubuntu">active</text><text x="27.17" y="147.901" fill="#151652" font-size="14" textLength="162.935" font-family="Ubuntu">(signs new certificates)</text><rect x="7" y="233.349" width="203.266" height="42.594" fill="#FFF4EC" style="stroke:#C95000;stroke-width:0.5;" rx="5" ry="5"/><text x="12" y="251.344" fill="#151652" font-size="14" textLength="55.528" font-family="Ubuntu">rotating</text><text x="12" y="267.641" fill="#151652" font-size="14" textLength="193.266" font-family="Ubuntu">(still trusted, signs nothing)</text><rect x="37.51" y="353.099" width="142.248" height="42.594" fill="#FDECEC" style="stroke:#C62828;stroke-width:0.5;" rx="5" ry="5"/><text x="42.51" y="371.094" fill="#151652" font-size="14" textLength="47.004" font-family="Ubuntu">retired</text><text x="42.51" y="387.391" fill="#151652" font-size="14" textLength="132.248" font-family="Ubuntu">(no longer trusted)</text><g class="start_entity" data-qualified-name=".start." id="ent0004" data-source-line="179"><ellipse cx="108.63" cy="62.609" rx="10" ry="10" fill="#151652" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0008" data-source-line="185"><ellipse cx="108.63" cy="447.689" rx="11" ry="11" fill="none" style="stroke:#151652;stroke-width:1;"/><ellipse cx="108.63" cy="447.689" rx="6" ry="6" fill="#222" style="stroke:#151652;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="187"><path d="M240.59,230.209 L240.59,250.649 L210.52,254.649 L240.59,258.649 L240.59,279.1 A5,5 0 0 0 245.59,284.1 L619.667,284.1 A5,5 0 0 0 624.667,279.1 L624.667,235.209 L614.667,225.209 L245.59,225.209 A5,5 0 0 0 240.59,230.209" style="stroke:#F46524;stroke-width:0.5;" fill="#FFF4EC"/><path d="M614.667,225.209 L614.667,232.709 A2.5,2.5 0 0 0 617.167,235.209 L624.667,235.209 L614.667,225.209" style="stroke:#F46524;stroke-width:0.5;" fill="#FFF4EC"/><text x="246.59" y="243.204" fill="#575757" font-size="14" textLength="339.719" font-family="Ubuntu">During the overlap the trust files list BOTH keys.</text><text x="246.59" y="259.501" fill="#575757" font-size="14" textLength="363.077" font-family="Ubuntu">Deploy the new trust files first: a server without the</text><text x="246.59" y="275.798" fill="#575757" font-size="14" textLength="318.985" font-family="Ubuntu">new key rejects certificates from the new CA.</text></g><!--link *start* to active--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk5" data-source-line="179" data-link-type="dependency"><path d="M108.63,73.089 C108.63,83.359 108.63,95.059 108.63,108.359" style="stroke:#54595F;stroke-width:1.6;" fill="none" id="*start*-to-active"/><polygon points="108.63,113.359,112.63,104.359,108.63,108.359,104.63,104.359,108.63,113.359" fill="#54595F" style="stroke:#54595F;stroke-width:1.6;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link active to rotating--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="183" data-link-type="dependency"><path d="M108.63,156.689 C108.63,178.209 108.63,206.629 108.63,228.079" style="stroke:#54595F;stroke-width:1.6;" fill="none" id="active-to-rotating"/><polygon points="108.63,233.079,112.63,224.079,108.63,228.079,104.63,224.079,108.63,233.079" fill="#54595F" style="stroke:#54595F;stroke-width:1.6;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="174.323" y="188.348" fill="#54595F" font-size="12" textLength="39.826" font-family="Ubuntu">Rotate</text><text x="109.63" y="202.317" fill="#54595F" font-size="12" textLength="169.213" font-family="Ubuntu">(a new active CA is created)</text></g><!--link rotating to retired--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-source-line="184" data-link-type="dependency"><path d="M108.63,276.429 C108.63,297.949 108.63,326.379 108.63,347.819" style="stroke:#54595F;stroke-width:1.6;" fill="none" id="rotating-to-retired"/><polygon points="108.63,352.819,112.63,343.819,108.63,347.819,104.63,343.819,108.63,352.819" fill="#54595F" style="stroke:#54595F;stroke-width:1.6;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="139.047" y="316.238" fill="#54595F" font-size="12" textLength="90.41" font-family="Ubuntu">Retire, after its</text><text x="109.63" y="330.207" fill="#54595F" font-size="12" textLength="149.244" font-family="Ubuntu">certificates have expired</text></g><!--link retired to *end*--><g class="link" data-entity-1="ent0003" data-entity-2="ent0008" id="lnk9" data-source-line="185" data-link-type="dependency"><path d="M108.63,396.019 C108.63,409.179 108.63,420.679 108.63,431.209" style="stroke:#54595F;stroke-width:1.6;" fill="none" id="retired-to-*end*"/><polygon points="108.63,436.209,112.63,427.209,108.63,431.209,104.63,427.209,108.63,436.209" fill="#54595F" style="stroke:#54595F;stroke-width:1.6;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><?plantuml-src hLXjRzis4FxkNt6B1pGPdCnnOoSDkWAEOpT5qpI8sm73EWoCHDkSPL8ZwRniwE_Qz_sotP6KJDboi7QplqZtyjpnxiZZwHbSPqpQZ-ykmSxuWf-2qa9bMYpDmOAtOA8qCM0yle117_X3dZ4XkJveF8Dhbd5hEUp6Al3z2c71zqqcKdwtxx3tJb49GBAxHsWUTWzxtGxy_PTxtqyvpw7P7hP7p_j4L9h9AOVcQDJhjTihohwGSsWENdJRxRP3cshEfQUs1oV7FIVhYRTQJ6SMciy7WxCN9qGt6KD_czsZxel