<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1505px;height:335px;background:#FFFFFF;" width="1505px" height="335px" viewBox="0 0 1505 335" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="177"><text x="560.436" y="30.421" fill="#151652" font-size="22" textLength="378.114" font-weight="700" font-family="Ubuntu">Principals: the two-places rule</text></g><!--cluster cert--><g class="cluster" data-qualified-name="cert" id="ent0001" data-source-line="180"><rect x="7" y="53.609" width="197" height="185" fill="#F60" style="stroke:#C95000;stroke-width:1.4;" rx="5" ry="5"/><text x="37.134" y="68.604" fill="#FFF" font-size="14" textLength="136.732" font-weight="700" font-family="Ubuntu">Alice's certificate</text><text x="14.934" y="84.901" fill="#FFF" font-size="14" textLength="181.132" font-weight="700" font-family="Ubuntu">(decided at issue time,</text><text x="29.084" y="101.198" fill="#FFF" font-size="14" textLength="152.831" font-weight="700" font-family="Ubuntu">follows the person)</text></g><!--cluster file--><g class="cluster" data-qualified-name="file" id="ent0004" data-source-line="184"><rect x="391" y="111.609" width="370" height="135" fill="#F4F4F4" style="stroke:#54595F;stroke-width:1.4;" rx="5" ry="5"/><text x="398.669" y="126.604" fill="#151652" font-size="14" textLength="354.662" font-weight="700" font-family="Ubuntu">Server web1: /etc/ssh/auth_principals/deploy</text><text x="503.676" y="142.901" fill="#151652" font-size="14" textLength="144.648" font-weight="700" font-family="Ubuntu">(decided per host,</text><text x="501.625" y="159.198" fill="#151652" font-size="14" textLength="148.75" font-weight="700" font-family="Ubuntu">follows the server)</text></g><!--entity p1--><g class="entity" data-qualified-name="cert.p1" id="ent0002" data-source-line="181"><rect x="56.3" y="186.469" width="97.403" height="36.297" fill="#FFF" style="stroke:#151652;stroke-width:1.4;" rx="5" ry="5"/><text x="66.3" y="209.464" fill="#151652" font-size="14" textLength="77.403" font-family="Ubuntu">developers</text></g><!--entity p2--><g class="entity" data-qualified-name="cert.p2" id="ent0003" data-source-line="182"><rect x="71.87" y="120.469" width="66.259" height="36.297" fill="#FFF" style="stroke:#151652;stroke-width:1.4;" rx="5" ry="5"/><text x="81.87" y="143.464" fill="#151652" font-size="14" textLength="46.259" font-family="Ubuntu">u:alice</text></g><!--entity f1--><g class="entity" data-qualified-name="file.f1" id="ent0005" data-source-line="185"><rect x="446.9" y="178.319" width="257.193" height="52.594" fill="#FFF" style="stroke:#151652;stroke-width:1.4;" rx="5" ry="5"/><text x="456.9" y="201.314" fill="#151652" font-size="14" textLength="77.403" font-family="Ubuntu">developers</text><text x="456.9" y="217.611" fill="#151652" font-size="14" textLength="237.193" font-family="Ubuntu">developers@web1.acme.example</text></g><!--entity ok--><g class="entity" data-qualified-name="ok" id="ent0006" data-source-line="187"><rect x="1077.18" y="178.319" width="134.632" height="52.594" fill="#0C8760" style="stroke:#0A7C58;stroke-width:1.4;" rx="5" ry="5"/><text x="1087.18" y="201.314" fill="#FFF" font-size="14" textLength="114.632" font-family="Ubuntu">Login as deploy:</text><text x="1087.18" y="217.611" fill="#FFF" font-size="14" textLength="77.205" font-weight="700" font-family="Ubuntu">ALLOWED</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="191"><path d="M798,266.169 L798,315.06 A5,5 0 0 0 803,320.06 L1485.986,320.06 A5,5 0 0 0 1490.986,315.06 L1490.986,271.169 L1480.986,261.169 L1148.49,261.169 L1144.49,231.349 L1140.49,261.169 L803,261.169 A5,5 0 0 0 798,266.169" style="stroke:#F46524;stroke-width:0.5;" fill="#FFF4EC"/><path d="M1480.986,261.169 L1480.986,268.669 A2.5,2.5