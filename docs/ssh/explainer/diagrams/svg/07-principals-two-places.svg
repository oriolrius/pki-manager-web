<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1367px;height:307px;background:#FFFFFF;" width="1367px" height="307px" viewBox="0 0 1367 307" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="521.739" y="35.12" fill="#151652" font-size="22" textLength="316.845" font-weight="700" font-family="Ubuntu">Principals: the two-places rule</text></g><!--cluster cert--><g class="cluster" data-qualified-name="cert" id="ent0001" data-source-line="5"><rect x="7" y="69.278" width="173" height="209" fill="#F60" style="stroke:#C95000;stroke-width:1.4;" rx="5" ry="5"/><text x="34.609" y="88.718" fill="#FFF" font-size="14" textLength="117.782" font-weight="700" font-family="Ubuntu">Alice's certificate</text><text x="18.607" y="104.804" fill="#FFF" font-size="14" textLength="149.785" font-weight="700" font-family="Ubuntu">(decided at issue time,</text><text x="28.533" y="120.89" fill="#FFF" font-size="14" textLength="129.933" font-weight="700" font-family="Ubuntu">follows the person)</text></g><!--cluster file--><g class="cluster" data-qualified-name="file" id="ent0004" data-source-line="9"><rect x="358" y="61.278" width="329" height="151" fill="#F4F4F4" style="stroke:#54595F;stroke-width:1.4;" rx="5" ry="5"/><text x="369.67" y="80.718" fill="#151652" font-size="14" textLength="305.661" font-weight="700" font-family="Ubuntu">Server web1: /etc/ssh/auth_principals/deploy</text><text x="462.398" y="96.804" fill="#151652" font-size="14" textLength="120.204" font-weight="700" font-family="Ubuntu">(decided per host,</text><text x="459.241" y="112.89" fill="#151652" font-size="14" textLength="126.517" font-weight="700" font-family="Ubuntu">follows the server)</text></g><!--entity p1--><g class="entity" data-qualified-name="cert.p1" id="ent0002" data-source-line="6"><rect x="44" y="144.278" width="98.728" height="44.086" fill="#FFF" style="stroke:#151652;stroke-width:1.4;" rx="5" ry="5"/><text x="58" y="171.718" fill="#151652" font-size="14" textLength="70.728" font-family="Ubuntu">developers</text></g><!--entity p2--><g class="entity" data-qualified-name="cert.p2" id="ent0003" data-source-line="7"><rect x="59.5" y="218.278" width="68.488" height="44.086" fill="#FFF" style="stroke:#151652;stroke-width:1.4;" rx="5" ry="5"/><text x="73.5" y="245.718" fill="#151652" font-size="14" textLength="40.488" font-family="Ubuntu">u:alice</text></g><!--entity f1--><g class="entity" data-qualified-name="file.f1" id="ent0005" data-source-line="10"><rect x="401" y="136.278" width="241.695" height="60.172" fill="#FFF" style="stroke:#151652;stroke-width:1.4;" rx="5" ry="5"/><text x="415" y="163.718" fill="#151652" font-size="14" textLength="70.728" font-family="Ubuntu">developers</text><text x="415" y="179.804" fill="#151652" font-size="14" textLength="213.695" font-family="Ubuntu">developers@web1.acme.example</text></g><!--entity ok--><g class="entity" data-qualified-name="ok" id="ent0006" data-source-line="12"><rect x="973" y="136.278" width="130.018" height="60.172" fill="#0C8760" style="stroke:#0A7C58;stroke-width:1.4;" rx="5" ry="5"/><text x="987" y="163.718" fill="#FFF" font-size="14" textLength="102.018" font-family="Ubuntu">Login as deploy:</text><text x="987" y="179.804" fill="#FFF" font-size="14" textLength="68.992" font-weight="700" font-family="Ubuntu">ALLOWED</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="16"><path d="M724,231.278 L724,287.536 A5,5 0 0 0 729,292.536 L1347.324,292.536 A5,5 0 0 0 1352.324,287.536 L1352.324,236.278 L1342.324,226.278 L1042,226.278 L1038,196.718 L1034,226.278 L729,226.278 A5,5 0 0 0 724,231.278" style="stroke:#F46524;stroke-width:0.5;" fill="#FFF4EC"/><path d="M1342.324,226.278 L1342.324,233.778 A2.5,2.5 0 0 0 1344.824,236.278 L1352.324,236.278 L1342.324,226.278" style="stroke:#F46524;stroke-width:0.5;" fill="#FFF4EC"/><text x="734" y="248.718" fill="#575757" font-size="14" textLength="599.324" font-family="Ubuntu">Login allowed only if the certificate and auth_principals/&lt;account> share at least one principal.</text><text x="734" y="264.804" fill="#575757" font-size="14" textLength="224.727" font-family="Ubuntu">In only one place: signature OK, but</text><text x="961.961" y="264.804" fill="#C62828" font-size="14" textLength="189.419" font-family="Ubuntu">Permission denied (publickey)</text><text x="734" y="280.89" fill="#575757" font-size="14" textLength="395.877" font-family="Ubuntu">sshd log: "Certificate does not contain an authorized principal"</text></g><!--link p1 to f1--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk7" data-source-line="13" data-link-type="dependency"><path d="M143.01,166.278 C205.23,166.278 310.3,166.278 395.68,166.278" style="stroke:#54595F;stroke-width:1.6;" fill="none" id="p1-to-f1"/><polygon points="400.68,166.278,391.68,162.278,395.68,166.278,391.68,170.278,400.68,166.278" fill="#54595F" style="stroke:#54595F;stroke-width:1.6;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="201" y="159.798" fill="#54595F" font-size="12" textLength="136.333" font-family="Ubuntu">same label in both places</text></g><!--link f1 to ok--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk8" data-source-line="14" data-link-type="dependency"><path d="M643.19,166.278 C746.14,166.278 885.43,166.278 967.74,166.278" style="stroke:#54595F;stroke-width:1.6;" fill="none" id="f1-to-ok"/><polygon points="972.74,166.278,963.74,162.278,967.74,166.278,963.74,170.278,972.74,166.278" fill="#54595F" style="stroke:#54595F;stroke-width:1.6;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><?plantuml-src VPD1Rzim38Nl_XLSTbWRD36Imr0OXh6Yss5OW1ROePS0XIBJjX1PD2IgMJRilu-orytjeISR9lNuFJtwdN7QnXg1E-nnHTwGzIQ6zH1xcx5XYt3lfSaCoeOYjG6VQ3LOfJ60ZnOpYmq34tZJTWoryQZPaCkozA9SAnAB6si