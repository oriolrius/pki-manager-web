<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:311px;height:632px;background:#FFFFFF;" width="311px" height="632px" viewBox="0 0 311 632" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="71.02" y="45.12" fill="#151652" font-size="22" textLength="167.465" font-weight="700" font-family="Ubuntu">The setup order</text></g><ellipse cx="153.753" cy="79.278" rx="10" ry="10" fill="#151652" style="stroke:#222;stroke-width:1;"/><rect x="16" y="109.278" width="275.505" height="44.086" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="30" y="136.718" fill="#151652" font-size="14" textLength="81.928" font-family="Ubuntu">1. Create the</text><text x="115.162" y="136.718" fill="#151652" font-size="14" textLength="53.298" font-weight="700" font-family="Ubuntu">User CA</text><text x="171.693" y="136.718" fill="#151652" font-size="14" textLength="48.272" font-family="Ubuntu">and the</text><text x="223.199" y="136.718" fill="#151652" font-size="14" textLength="54.306" font-weight="700" font-family="Ubuntu">Host CA</text><rect x="53.66" y="173.364" width="200.185" height="76.258" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="67.66" y="200.804" fill="#151652" font-size="14" textLength="110.81" font-family="Ubuntu">2. Hand out trust:</text><text x="67.66" y="216.89" fill="#151652" font-size="14" textLength="172.185" font-family="Ubuntu">User CA key -> every server</text><text x="67.66" y="232.976" fill="#151652" font-size="14" textLength="169.847" font-family="Ubuntu">Host CA line -> every client</text><rect x="34.389" y="269.622" width="238.727" height="60.172" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="48.389" y="297.062" fill="#151652" font-size="14" textLength="112.322" font-family="Ubuntu">3. Enrol each host</text><text x="48.389" y="313.148" fill="#151652" font-size="14" textLength="210.727" font-family="Ubuntu">(host certificate + deploy bundle)</text><rect x="31.862" y="349.794" width="243.781" height="60.172" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="45.862" y="377.234" fill="#151652" font-size="14" textLength="215.781" font-family="Ubuntu">4. Create principals and map them</text><text x="45.862" y="393.32" fill="#151652" font-size="14" textLength="162.679" font-family="Ubuntu">to local accounts per host</text><rect x="62.466" y="429.966" width="182.573" height="60.172" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="76.466" y="457.405" fill="#151652" font-size="14" textLength="152.039" font-family="Ubuntu">5. Issue user certificates</text><text x="76.466" y="473.491" fill="#151652" font-size="14" textLength="154.573" font-family="Ubuntu">with matching principals</text><rect x="29.552" y="510.137" width="248.401" height="60.172" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="43.552" y="537.577" fill="#151652" font-size="14" textLength="185.499" font-family="Ubuntu">6. End access: short lifetimes;</text><text x="43.552" y="553.663" fill="#151652" font-size="14" textLength="220.401" font-family="Ubuntu">KRL or per-host block when urgent</text><ellipse cx="153.753" cy="601.309" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="153.753" cy="601.309" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="153.753" y1="89.278" x2="153.753" y2="109.278" style="stroke:#54595F;stroke-width:1.6;"/><polygon points="149.753,99.278,153.753,109.278,157.753,99.278,153.753,103.278" fill="#54595F" style="stroke:#54595F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="153.753" y1="153.364" x2="153.753" y2="173.364" style="stroke:#54595F;stroke-width:1.6;"/><polygon poi