<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:339px;height:579px;background:#FFFFFF;" width="339px" height="579px" viewBox="0 0 339 579" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="177"><text x="69.635" y="40.421" fill="#151652" font-size="22" textLength="198.333" font-weight="700" font-family="Ubuntu">The setup order</text></g><ellipse cx="167.801" cy="71.609" rx="10" ry="10" fill="#151652" style="stroke:#222;stroke-width:1;"/><rect x="16" y="101.609" width="303.603" height="36.297" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="26" y="124.604" fill="#151652" font-size="14" textLength="92.06" font-family="Ubuntu">1. Create the</text><text x="122.51" y="124.604" fill="#151652" font-size="14" textLength="62.084" font-weight="700" font-family="Ubuntu">User CA</text><text x="189.044" y="124.604" fill="#151652" font-size="14" textLength="53.765" font-family="Ubuntu">and the</text><text x="247.259" y="124.604" fill="#151652" font-size="14" textLength="62.344" font-weight="700" font-family="Ubuntu">Host CA</text><rect x="58.215" y="157.906" width="219.172" height="68.891" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="68.215" y="180.901" fill="#151652" font-size="14" textLength="124.12" font-family="Ubuntu">2. Hand out trust:</text><text x="68.215" y="197.198" fill="#151652" font-size="14" textLength="199.172" font-family="Ubuntu">User CA key -> every server</text><text x="68.215" y="213.495" fill="#151652" font-size="14" textLength="193.532" font-family="Ubuntu">Host CA line -> every client</text><rect x="39.567" y="246.797" width="256.469" height="52.594" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="49.567" y="269.792" fill="#151652" font-size="14" textLength="126.622" font-family="Ubuntu">3. Enrol each host</text><text x="49.567" y="286.089" fill="#151652" font-size="14" textLength="236.469" font-family="Ubuntu">(host certificate + deploy bundle)</text><rect x="35.735" y="319.391" width="264.132" height="52.594" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="45.735" y="342.386" fill="#151652" font-size="14" textLength="244.132" font-family="Ubuntu">4. Create principals and map them</text><text x="45.735" y="358.683" fill="#151652" font-size="14" textLength="181.022" font-family="Ubuntu">to local accounts per host</text><rect x="71.716" y="391.984" width="192.17" height="52.594" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="81.716" y="414.979" fill="#151652" font-size="14" textLength="171.384" font-family="Ubuntu">5. Issue user certificates</text><text x="81.716" y="431.276" fill="#151652" font-size="14" textLength="172.17" font-family="Ubuntu">with matching principals</text><rect x="36.173" y="464.578" width="263.257" height="52.594" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="46.173" y="487.573" fill="#151652" font-size="14" textLength="210.595" font-family="Ubuntu">6. End access: short lifetimes;</text><text x="46.173" y="503.87" fill="#151652" font-size="14" textLength="243.257" font-family="Ubuntu">KRL or per-host block when urgent</text><ellipse cx="167.801" cy="548.172" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="167.801" cy="548.172" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="167.801" y1="81.609" x2="167.801" y2="101.609" style="stroke:#54595F;stroke-width:1.6;"/><polygon points="163.801,91.609,167.801,101.609,171.801,91.609,167.801,95.609" fill="#54595F" style="stroke:#54595F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="167.801" y1="137.906" x2="167.801" y2="157.906" style="stroke:#54595F;stroke-width:1.6;"/><polygon