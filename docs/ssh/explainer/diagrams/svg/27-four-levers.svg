<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:718px;height:308px;background:#FFFFFF;" width="718px" height="308px" viewBox="0 0 718 308" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="207.278" y="35.12" fill="#151652" font-size="22" textLength="296.979" font-weight="700" font-family="Ubuntu">Changing access: four levers</text></g><!--entity l1--><g class="entity" data-qualified-name="l1" id="ent0001" data-source-line="3"><rect x="7" y="61.278" width="357.629" height="92.344" fill="#F60" style="stroke:#C95000;stroke-width:1.4;" rx="5" ry="5"/><text x="21" y="88.718" fill="#FFF" font-size="14" textLength="103.53" font-weight="700" font-family="Ubuntu">New certificate</text><text x="21" y="104.804" fill="#FFF" font-size="14" textLength="115.136" font-family="Ubuntu">scope: one person</text><text x="21" y="120.89" fill="#FFF" font-size="14" textLength="329.629" font-family="Ubuntu">when: after the old one is gone (expired or revoked)</text><text x="21" y="136.976" fill="#FFF" font-size="14" textLength="245.265" font-family="Ubuntu">note: bulk renew COPIES old principals</text></g><!--entity l2--><g class="entity" data-qualified-name="l2" id="ent0002" data-source-line="4"><rect x="395.5" y="61.278" width="309.035" height="92.344" fill="#F4F4F4" style="stroke:#54595F;stroke-width:1.4;" rx="5" ry="5"/><text x="409.5" y="88.718" fill="#151652" font-size="14" textLength="108.906" font-weight="700" font-family="Ubuntu">Mapping change</text><text x="409.5" y="104.804" fill="#151652" font-size="14" textLength="110.852" font-family="Ubuntu">scope: one server</text><text x="409.5" y="120.89" fill="#151652" font-size="14" textLength="281.035" font-family="Ubuntu">when: next login after the files are deployed</text><text x="409.5" y="136.976" fill="#151652" font-size="14" textLength="198.967" font-family="Ubuntu">(even with existing certificates)</text></g><!--entity l3--><g class="entity" data-qualified-name="l3" id="ent0003" data-source-line="5"><rect x="63" y="193.278" width="245.895" height="76.258" fill="#FDECEC" style="stroke:#C62828;stroke-width:1.4;" rx="5" ry="5"/><text x="77" y="220.718" fill="#8E1B1B" font-size="14" textLength="90.118" font-weight="700" font-family="Ubuntu">Revoke (KRL)</text><text x="77" y="236.804" fill="#8E1B1B" font-size="14" textLength="217.895" font-family="Ubuntu">scope: one certificate, everywhere</text><text x="77" y="252.89" fill="#8E1B1B" font-size="14" textLength="188.187" font-family="Ubuntu">when: next KRL pull (~15 min)</text></g><!--entity l4--><g class="entity" data-qualified-name="l4" id="ent0004" data-source-line="6"><rect x="339" y="193.278" width="216.187" height="76.258" fill="#FDECEC" style="stroke:#C62828;stroke-width:1.4;" rx="5" ry="5"/><text x="353" y="220.718" fill="#8E1B1B" font-size="14" textLength="37.436" font-weight="700" font-family="Ubuntu">Block</text><text x="353" y="236.804" fill="#8E1B1B" font-size="14" textLength="182.685" font-family="Ubuntu">scope: one identity, one host</text><text x="353" y="252.89" fill="#8E1B1B" font-size="14" textLength="188.187" font-family="Ubuntu">when: next KRL pull (~15 min)</text></g><!--link l1 to l2--><!--link l3 to l4--><!--link l1 to l3--><g class="caption" data-source-line="10"><text x="209.834" y="294.056" fill="#7A7A7A" font-size="12" textLength="291.866" font-family="Ubuntu">None of the four closes a session that is already open.</text></g><?plantuml-src ZP9FJoCn3CNl_HHUJcr5aLZOIuKuW3WW_kmAZfH3I3mTgwuT9HdQNlQpummWsdBXD1h7zlkzb_mYyTm5XDBY4YUQI3bHbuzYj-H1eS88bwsJESaSdFUOynGQxH8mlcBAWuI-sB6r7Op7zxW2ZwbGGzuL78zdahr6d88AGhH-bPciMfGfkAPWghAW7FfpoZ2lto6k8oMqOeA4hxh0C9g9QB4zBnqlh2WcTFdtt_NLOpyTazcWw3WVWCl0nt1srcLCv-UxV7Sknch4LqVxUDPlZZxn1DS5MCtt5cb3Z1bSGWWOMJSOPZAq70HML5h0DUNIx__A88_UaNuRKXtVHthe3SBm