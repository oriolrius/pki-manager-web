<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:U;src:url(../../engine/fonts/Ubuntu-Regular.ttf);font-weight:400}
@font-face{font-family:U;src:url(../../engine/fonts/Ubuntu-Medium.ttf);font-weight:500}
@font-face{font-family:U;src:url(../../engine/fonts/Ubuntu-Bold.ttf);font-weight:700}
@font-face{font-family:M;src:url(../../engine/fonts/UbuntuMono-Regular.ttf);font-weight:400}
@font-face{font-family:M;src:url(../../engine/fonts/UbuntuMono-Bold.ttf);font-weight:700}
html,body{margin:0;background:#0E0F3A}
</style></head><body>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="U">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1C66"/><stop offset="1" stop-color="#0B0C30"/></linearGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#FFFFFF" opacity=".07"/></pattern>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<rect width="1280" height="720" fill="url(#bg)"/>
<rect width="1280" height="720" fill="url(#dots)"/>
<circle cx="1010" cy="330" r="330" fill="#FF6600" opacity=".08"/>

<!-- left: title block -->
<g transform="translate(78,0)">
  <text x="0" y="128" font-size="30" font-weight="500" fill="#FF8A3D" letter-spacing="5">PKI MANAGER · VIDEO SERIES</text>
  <text x="-6" y="300" font-size="190" font-weight="700" fill="#FFFFFF" letter-spacing="-4">SSH</text>
  <text x="0" y="398" font-size="92" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Certificates</text>
  <rect x="2" y="432" width="190" height="12" rx="6" fill="#FF6600"/>
  <text x="0" y="500" font-size="36" font-weight="400" fill="#C9CBEE">From zero to real-world</text>
  <text x="0" y="544" font-size="36" font-weight="400" fill="#C9CBEE">access design</text>
  <g font-size="26" font-weight="500">
    <rect x="0" y="592" width="196" height="54" rx="27" fill="#FF6600"/><text x="98" y="628" text-anchor="middle" fill="#fff">19 episodes</text>
    <rect x="214" y="592" width="276" height="54" rx="27" fill="none" stroke="#7F82C9" stroke-width="2.5"/><text x="352" y="628" text-anchor="middle" fill="#E4E5F7">for Linux sysadmins</text>
  </g>
</g>

<!-- right: terminal behind -->
<g transform="translate(690,452) rotate(-3)" filter="url(#sh)">
  <rect width="520" height="190" rx="16" fill="#0A0B26" stroke="#2C2E7A" stroke-width="2"/>
  <circle cx="28" cy="26" r="7" fill="#FF5F57"/><circle cx="52" cy="26" r="7" fill="#FEBC2E"/><circle cx="76" cy="26" r="7" fill="#28C840"/>
  <g font-family="M" font-size="25">
    <text x="26" y="86" fill="#7F82C9">$ <tspan fill="#FFFFFF">ssh deploy@acme-prod-01</tspan></text>
    <text x="26" y="128" fill="#3CCB98" font-weight="700">Accepted publickey</text>
    <text x="26" y="164" fill="#9EA1D8">ID ana@ops (serial 42) CA</text>
  </g>
</g>

<!-- right: certificate card -->
<g transform="translate(742,96) rotate(4)" filter="url(#sh)">
  <rect width="430" height="330" rx="22" fill="#FFFFFF"/>
  <rect width="430" height="74" rx="22" fill="#FF6600"/><rect y="52" width="430" height="22" fill="#FF6600"/>
  <!-- key icon -->
  <g transform="translate(30,20)" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
    <circle cx="15" cy="17" r="12"/><path d="M27 17h30M47 17v11M56 17v8"/>
  </g>
  <text x="104" y="48" font-size="29" font-weight="700" fill="#fff">SSH user certificate</text>
  <g font-size="22">
    <text x="32" y="122" fill="#7A7A7A">Key ID</text><text x="170" y="122" font-family="M" font-size="25" font-weight="700" fill="#151652">ana@ops</text>
    <text x="32" y="168" fill="#7A7A7A">Principals</text>
    <rect x="168" y="144" width="108" height="36" rx="18" fill="#FFF4EC" stroke="#FF6600" stroke-width="2"/><text x="222" y="169" text-anchor="middle" font-family="M" font-size="22" font-weight="700" fill="#C95000">deploy</text>
    <rect x="286" y="144" width="98" height="36" rx="18" fill="#E7F6F0" stroke="#0C8760" stroke-width="2"/><text x="335" y="169" text-anchor="middle" font-family="M" font-size="22" font-weight="700" fill="#0C8760">audit</text>
    <text x="32" y="216" fill="#7A7A7A">Valid</text><text x="170" y="216" font-weight="500" fill="#151652">7 days</text>
    <text x="32" y="262" fill="#7A7A7A">Serial</text><text x="170" y="262" font-family="M" font-size="25" fill="#151652">42</text>
  </g>
  <!-- CA stamp -->
  <g transform="translate(340,262) rotate(-14)">
    <circle r="56" fill="none" stroke="#0C8760" stroke-width="5"/>
    <circle r="46" fill="none" stroke="#0C8760" stroke-width="2"/>
    <text y="-6" text-anchor="middle" font-size="24" font-weight="700" fill="#0C8760">CA</text>
    <text y="20" text-anchor="middle" font-size="15" font-weight="700" fill="#0C8760" letter-spacing="2">SIGNED</text>
  </g>
</g>
</svg></body></html>
