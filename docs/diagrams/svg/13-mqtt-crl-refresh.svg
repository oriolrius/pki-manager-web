="129.773" font-family="Ubuntu">revoke sensor-01 (UI)</text><line x1="215.014" y1="202.813" x2="257.014" y2="202.813" style="stroke:#54595F;stroke-width:1.6;"/><line x1="257.014" y1="202.813" x2="257.014" y2="215.813" style="stroke:#54595F;stroke-width:1.6;"/><line x1="216.014" y1="215.813" x2="257.014" y2="215.813" style="stroke:#54595F;stroke-width:1.6;"/><polygon points="226.014,211.813,216.014,215.813,226.014,219.813,222.014,215.813" fill="#54595F" style="stroke:#54595F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="222.014" y="190.998" fill="#54595F" font-size="12" textLength="12.908" font-weight="700" font-family="Ubuntu">2.</text><text x="238.922" y="184.014" fill="#54595F" font-size="12" textLength="119.021" font-family="Ubuntu">new CRL at the URL</text><text x="238.922" y="197.982" fill="#54595F" font-size="12" textLength="113.021" font-family="Ubuntu">in every certificate</text><polygon points="226.014,239.781,216.014,243.781,226.014,247.781,222.014,243.781" fill="#54595F" style="stroke:#54595F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="220.014" y1="243.781" x2="363.944" y2="243.781" style="stroke:#54595F;stroke-width:1.6;"/><text x="232.014" y="238.951" fill="#54595F" font-size="12" textLength="12.908" font-weight="700" font-family="Ubuntu">3.</text><text x="248.922" y="238.951" fill="#54595F" font-size="12" textLength="100.816" font-family="Ubuntu">curl the CRL URL</text><line x1="364.944" y1="271.75" x2="406.944" y2="271.75" style="stroke:#54595F;stroke-width:1.6;"/><line x1="406.944" y1="271.75" x2="406.944" y2="284.75" style="stroke:#54595F;stroke-width:1.6;"/><line x1="365.944" y1="284.75" x2="406.944" y2="284.75" style="stroke:#54595F;stroke-width:1.6;"/><polygon points="375.944,280.75,365.944,284.75,375.944,288.75,371.944,284.75" fill="#54595F" style="stroke:#54595F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="371.944" y="266.92" fill="#54595F" font-size="12" textLength="12