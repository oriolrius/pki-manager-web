<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:646px;height:570px;background:#FFFFFF;" width="646px" height="570px" viewBox="0 0 646 570" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="177"><text x="20" y="40.421" fill="#151652" font-size="22" textLength="604.817" font-weight="700" font-family="Ubuntu">PKCE: a one-time proof instead of a client secret</text></g><ellipse cx="347.302" cy="71.609" rx="10" ry="10" fill="#151652" style="stroke:#222;stroke-width:1;"/><rect x="179.026" y="101.609" width="336.552" height="52.594" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="189.026" y="124.604" fill="#151652" font-size="14" textLength="210.055" font-family="Ubuntu">Frontend generates a random</text><text x="403.531" y="124.604" fill="#151652" font-size="14" textLength="102.047" font-weight="700" font-family="Ubuntu">code_verifier</text><text x="189.026" y="140.901" fill="#151652" font-size="14" textLength="139.296" font-family="Ubuntu">(43-128 characters)</text><rect x="155.89" y="174.203" width="382.824" height="52.594" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="165.89" y="197.198" fill="#151652" font-size="14" textLength="136.616" font-family="Ubuntu">Frontend computes</text><text x="165.89" y="213.495" fill="#151652" font-size="14" textLength="362.824" font-family="'Ubuntu Mono'">code_challenge = base64url(sha256(code_verifier))</text><rect x="100.683" y="246.797" width="493.238" height="68.891" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="110.683" y="269.792" fill="#151652" font-size="14" textLength="224.581" font-family="Ubuntu">Authorization request sends the</text><text x="339.714" y="269.792" fill="#151652" font-size="14" textLength="120.723" font-weight="700" font-family="Ubuntu">code_challenge</text><text x="110.683" y="286.089" fill="#151652" font-size="14" textLength="115.459" font-family="Ubuntu">(not the verifier)</text><text x="110.683" y="302.386" fill="#151652" font-size="14" textLength="473.238" font-family="'Ubuntu Mono'">GET /authorize?code_challenge=…&amp;code_challenge_method=S256</text><rect x="197.292" y="335.688" width="300.021" height="52.594" fill="#FFF" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="207.292" y="358.683" fill="#151652" font-size="14" textLength="173.523" font-family="Ubuntu">Token request sends the</text><text x="385.265" y="358.683" fill="#151652" font-size="14" textLength="102.047" font-weight="700" font-family="Ubuntu">code_verifier</text><text x="207.292" y="374.979" fill="#151652" font-size="14" textLength="279.234" font-family="'Ubuntu Mono'">POST /token  code=…  code_verifier=…</text><polygon points="141.92,408.281,552.684,408.281,564.684,420.281,552.684,432.281,141.92,432.281,129.92,420.281,141.92,408.281" fill="#F4F4F4" style="stroke:#54595F;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="141.92" y="425.128" fill="#151652" font-size="14" textLength="410.765" font-family="Ubuntu">Keycloak: sha256(code_verifier) = stored code_challenge?</text><text x="91.969" y="417.451" fill="#54595F" font-size="12" textLength="37.951" font-family="Ubuntu">match</text><text x="564.684" y="417.451" fill="#54595F" font-size="12" textLength="56.713" font-family="Ubuntu">no match</text><rect x="20.42" y="442.281" width="198.999" height="36.297" fill="#E7F6F0" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="30.42" y="465.276" fill="#151652" font-size="14" textLength="178.999" font-family="Ubuntu">Issue tokens to this client</text><rect x="542.669" y="442.281" width="64.03" height="36.297" fill="#FDECEC" style="stroke:#151652;stroke-width:0.5;" rx="5" ry="5"/><text x="552.669" y="465.276" fill="#151652" font-size="14" tex