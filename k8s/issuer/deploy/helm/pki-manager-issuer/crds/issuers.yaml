apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: issuers.pki-manager.issuer.io
spec:
  group: pki-manager.issuer.io
  scope: Namespaced
  names:
    kind: Issuer
    listKind: IssuerList
    plural: issuers
    singular: issuer
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=='Ready')].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [url, caId, authSecretRef]
              x-kubernetes-validations:
                - rule: "self.url.startsWith('http://') || self.url.startsWith('https://')"
                  message: "url must start with http:// or https://"
              properties:
                url:
                  type: string
                  pattern: "^https?://.+"
                caId:
                  type: string
                  minLength: 1
                caBundle:
                  type: string
                  format: byte
                authSecretRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                certificateType:
                  type: string
                  enum: [server, client, dual]
                  default: dual
                revokeOnDelete:
                  type: boolean
                  default: false
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type: { type: string }
                      status: { type: string, enum: ["True", "False", "Unknown"] }
                      observedGeneration: { type: integer }
                      lastTransitionTime: { type: string, format: date-time }
                      reason: { type: string }
                      message: { type: string }
---
