{{- if .Values.approver.enabled }}
# Grants cert-manager's approver controller permission to approve CertificateRequests that
# reference this external issuer's signers. Without it, cert-manager 1.16+ leaves such
# requests unapproved (Pending) forever, since its default approver only auto-approves
# first-party (cert-manager.io) signers. See docs/install.md (Approval).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pki-manager-issuer.fullname" . }}-approver
  labels:
    {{- include "pki-manager-issuer.labels" . | nindent 4 }}
rules:
  - apiGroups: [cert-manager.io]
    resources: [signers]
    verbs: [approve]
    resourceNames:
      - issuers.pki-manager.issuer.io/*
      - clusterissuers.pki-manager.issuer.io/*
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pki-manager-issuer.fullname" . }}-approver
  labels:
    {{- include "pki-manager-issuer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pki-manager-issuer.fullname" . }}-approver
subjects:
  - kind: ServiceAccount
    name: {{ .Values.approver.certManagerServiceAccount.name }}
    namespace: {{ .Values.approver.certManagerServiceAccount.namespace }}
{{- end }}
