apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pki-manager-data
  namespace: pki-manager
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pki-manager-backend
  namespace: pki-manager
spec:
  replicas: 1
  selector:
    matchLabels: { app: pki-manager-backend }
  template:
    metadata:
      labels: { app: pki-manager-backend }
    spec:
      automountServiceAccountToken: false
      securityContext: { fsGroup: 1001 }
      containers:
        - name: backend
          image: pki-manager-backend:e2e
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - { name: OPENBAO_ADDR, value: 'https://openbao:8200' }
            - { name: OPENBAO_CACERT, value: /run/ca/ca.pem }
            - { name: OPENBAO_TOKEN_FILE, value: /run/token/backend-token }
            - name: DATABASE_PATH
              value: /data/pki.db
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
          volumeMounts:
            - { name: ca, mountPath: /run/ca, readOnly: true }
            - { name: token, mountPath: /run/token, readOnly: true }
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 1, memory: 512Mi }
      volumes:
        - { name: ca, configMap: { name: openbao-client-ca } }
        - { name: token, secret: { secretName: pki-manager-backend-token, defaultMode: 0440 } }
        - name: data
          persistentVolumeClaim:
            claimName: pki-manager-data
---
apiVersion: v1
kind: Service
metadata:
  name: pki-manager-backend
  namespace: pki-manager
spec:
  selector: { app: pki-manager-backend }
  ports:
    - port: 3000
      targetPort: 3000
      name: http
