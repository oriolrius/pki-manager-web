services:
  # OpenBao (PKI Manager fork): keeps every private key. Internal network only; operators
  # use `docker exec pki-openbao bao ...`. Initialize and unseal it by hand
  # (docs/operations/openbao.md). State in ../openbao/state, owned by uid 1000.
  openbao:
    image: ${OPENBAO_IMAGE:?set OPENBAO_IMAGE (openbao/image.env)}
    container_name: pki-openbao
    restart: unless-stopped
    networks:
      - keystore-internal
    volumes:
      - ../openbao/config:/openbao/config:ro
      - ../openbao/state/data:/openbao/data
      - ../openbao/state/logs:/openbao/logs
      - ../openbao/state/tls:/openbao/tls:ro
    environment:
      - BAO_API_ADDR=https://openbao:8200
      - BAO_CLUSTER_ADDR=https://openbao:8201
      - BAO_ADDR=https://127.0.0.1:8200
      - BAO_CACERT=/openbao/tls/ca.pem
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # One-shot operator commands. The operator passes BAO_TOKEN to compose run.
  openbao-bootstrap:
    profiles: [bootstrap]
    image: ${OPENBAO_IMAGE:?set OPENBAO_IMAGE (openbao/image.env)}
    user: "1001:1001"
    entrypoint: ["/bin/sh", "/openbao/scripts/bootstrap.sh"]
    networks:
      - keystore-internal
    volumes:
      - ../openbao/scripts:/openbao/scripts:ro
      - ../openbao/policies:/openbao/policies:ro
      - ../openbao/state/tls/ca.pem:/openbao/tls/ca.pem:ro
      - ../openbao/state/approle:/openbao/setup/approle
    environment:
      - BAO_ADDR=https://openbao:8200
      - BAO_CACERT=/openbao/tls/ca.pem
      - SECRETS_DIR=/openbao/setup
      - OPENBAO_TRANSIT_MOUNT=${OPENBAO_TRANSIT_MOUNT:-pki-manager}
      - OPENBAO_RA_MOUNT=${OPENBAO_RA_MOUNT:-pki-manager-ra}
      - OPENBAO_SSH_MOUNT=${OPENBAO_SSH_MOUNT:-pki-manager-ssh}
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:uid=1001,gid=1001

  # OpenBao Agent: AppRole login for the backend, token written to a shared file.
  # Runs as the backend uid (1001) so the token file can be 0400. AppRole credentials in
  # ../openbao/state/approle (0400, uid 1001), never mounted into the backend.
  openbao-agent:
    image: ${OPENBAO_IMAGE:?set OPENBAO_IMAGE (openbao/image.env)}
    container_name: pki-openbao-agent
    restart: unless-stopped
    user: "1001:1001"
    command: ["agent", "-config=/openbao/agent/agent.hcl"]
    networks:
      - keystore-internal
    volumes:
      - ../openbao/agent:/openbao/agent:ro
      - ../openbao/state/tls/ca.pem:/openbao/tls/ca.pem:ro
      - ../openbao/state/approle:/openbao/approle:ro
      - ../openbao/state/token:/openbao/token
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:uid=1001,gid=1001
    depends_on:
      openbao:
        condition: service_started

  # Backend API
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: backend
    image: ghcr.io/oriolrius/pki-manager-web/backend:${IMAGE_TAG:-latest}
    container_name: pki-backend
    restart: unless-stopped
    networks:
      - pki-network
      - keystore-internal
    volumes:
      - ../pki:/app/backend/data
      - ../openbao/state/tls/ca.pem:/run/openbao/ca.pem:ro
      - ../openbao/state/token:/run/openbao/token:ro
    environment:
      # Server configuration
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${BACKEND_PORT:-3000}
      - HOST=${BACKEND_HOST:-0.0.0.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}

      # Browser origins allowed to call the API (CORS). Empty allows every origin.
      - FRONTEND_URL=${FRONTEND_URL:-}

      # Database
      - DATABASE_PATH=${DATABASE_PATH:-/app/backend/data/pki.db}

      # OpenBao (key store). The token file is rewritten by openbao-agent; the backend
      # reads it on every call. Mount paths: openbao/scripts/bootstrap.sh configure.
      - OPENBAO_ADDR=${OPENBAO_ADDR:-https://openbao:8200}
      - OPENBAO_CACERT=/run/openbao/ca.pem
      - OPENBAO_TOKEN_FILE=/run/openbao/token/backend-token
      - OPENBAO_TRANSIT_MOUNT=${OPENBAO_TRANSIT_MOUNT:-pki-manager}
      - OPENBAO_RA_MOUNT=${OPENBAO_RA_MOUNT:-pki-manager-ra}
      - OPENBAO_SSH_MOUNT=${OPENBAO_SSH_MOUNT:-pki-manager-ssh}

      # CRL Distribution Point
      - CRL_DISTRIBUTION_URL=${CRL_DISTRIBUTION_URL:-http://localhost:3000/crl}

      # Reverse proxies allowed to set the client IP (see docs/operations/deployment.md)
      - TRUST_PROXY=${TRUST_PROXY:-}

      # CA private key export as keystore (off unless "true"; admin only, audited)
      - ALLOW_CA_KEY_EXPORT=${ALLOW_CA_KEY_EXPORT:-false}

      # OIDC Authentication (optional - leave OIDC_ISSUER unset to disable)
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:-}
      - OIDC_ROLES_SOURCE=${OIDC_ROLES_SOURCE:-token}
      - OIDC_ROLES_CLAIM=${OIDC_ROLES_CLAIM:-realm_access.roles}
      - OIDC_DISCOVERY_BASE_URL=${OIDC_DISCOVERY_BASE_URL:-}

      # SSH CA switches (see docs/ssh/api-contract.md). The defaults are the backend defaults.
      - ALLOW_UNAUTHENTICATED_SSH_CA=${ALLOW_UNAUTHENTICATED_SSH_CA:-false}
      - SSH_ECIES_ENABLED=${SSH_ECIES_ENABLED:-false}
      - SSH_HOST_KRL_SERVE=${SSH_HOST_KRL_SERVE:-true}
      - SSH_HOST_KRL_PUBLIC=${SSH_HOST_KRL_PUBLIC:-false}
      - SSH_BLOCK_ISSUANCE_GATE=${SSH_BLOCK_ISSUANCE_GATE:-false}
    ports:
      - "${BACKEND_EXTERNAL_PORT:-3000}:3000"
    depends_on:
      openbao-agent:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp

  # Frontend UI
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: frontend
      args:
        # Build-time default of the API URL. apiUrl in config.json overrides it at run time.
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3000/trpc}
    image: ghcr.io/oriolrius/pki-manager-web/frontend:${IMAGE_TAG:-latest}
    container_name: pki-frontend
    restart: unless-stopped
    networks:
      - pki-network
    volumes:
      # Runtime settings of the web UI: apiUrl and oidc (docs/operations/deployment.md).
      - ./config.json:/usr/share/nginx/html/config.json:ro
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /var/cache/nginx:uid=1001,gid=1001
      - /var/run:uid=1001,gid=1001
      - /var/log/nginx:uid=1001,gid=1001

networks:
  pki-network:
    name: pki-network
    external: false

  keystore-internal:
    internal: true
