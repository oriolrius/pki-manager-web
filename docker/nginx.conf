# Run nginx as non-root user
user nginx-user;

# Auto-detect number of CPUs
worker_processes auto;

# Error log location
error_log /var/log/nginx/error.log warn;

# PID file location (writable by non-root user via tmpfs)
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Client body temp path (will be provided by tmpfs mount)
    client_body_temp_path /var/cache/nginx/client_temp 1 2;
    proxy_temp_path /var/cache/nginx/proxy_temp 1 2;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp 1 2;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp 1 2;
    scgi_temp_path /var/cache/nginx/scgi_temp 1 2;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/xml+rss application/json
               application/wasm image/svg+xml;

    # Server configuration
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;" always;

        # ─── Single-origin edge proxy (TASK-209) ────────────────────────────────
        # This container can front BOTH the SPA and the backend on one origin.
        # The backend serves public trust-material/KRL/CRL routes at the server
        # ROOT (/ssh/host-ca-keys, /krl/<caId>.bin, /crl/<caId>.crl, ...), but the
        # SPA ALSO owns the /ssh/* URL namespace for its UI (/ssh/cas, /ssh/hosts,
        # /ssh/krl, /ssh/users, ...). On a single-origin deployment the edge must
        # send ONLY the specific backend-owned paths to http://backend:3000 and let
        # everything else fall through to the SPA. The location blocks below are
        # placed BEFORE the `location /` SPA fallback; nginx evaluates regex
        # locations (in order) ahead of the prefix fallback, so the specific
        # backend `/ssh/...` paths win while `/ssh/cas`, `/ssh/hosts`, ... stay SPA.
        #
        # NOTE: this is ADDITIVE. The separate-port compose model (browser talks to
        # the backend directly via VITE_API_URL) keeps working — the SPA is still
        # served here. `backend` resolves by service name on `pki-network`, and the
        # frontend `depends_on` the backend being healthy so the name resolves at
        # nginx start. For a single-origin setup, point VITE_API_URL at `/trpc`.

        # Standard proxy headers, inherited by every proxy_pass location below.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # REST + OpenAPI/Swagger API and the tRPC endpoint.
        location /api/ {
            proxy_pass http://backend:3000;
        }
        location /trpc {
            proxy_pass http://backend:3000;
        }

        # Public CRL and CA-certificate download roots (backend root routes).
        location ~ ^/crl/ {
            proxy_pass http://backend:3000;
        }
        location ~ ^/cas/[^/]+\.(pem|crt|cer|der)$ {
            proxy_pass http://backend:3000;
        }

        # Public SSH KRL roots (per-CA and per-host revoked-keys files).
        location ~ ^/krl/ {
            proxy_pass http://backend:3000;
        }

        # Public SSH trust material — ONLY these specific backend paths. Everything
        # else under /ssh/ (the SPA's UI routes) falls through to `location /`.
        location ~ ^/ssh/(host-ca-keys|trusted-user-ca-keys|cert-authority)$ {
            proxy_pass http://backend:3000;
        }
        location ~ ^/ssh/cas/[^/]+/ca\.pub$ {
            proxy_pass http://backend:3000;
        }
        location ~ ^/ssh/hosts/[^/]+/(cert\.pub|sshd-config)$ {
            proxy_pass http://backend:3000;
        }
        # ─── end single-origin edge proxy ───────────────────────────────────────

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Don't cache HTML to ensure fresh content
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # SPA fallback - serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
