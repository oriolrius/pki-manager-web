# Docker Compose for E2E Testing
#
# This configuration provides a complete local environment for running E2E tests,
# simulating a production deployment with OIDC authentication via Keycloak.
#
# Usage:
#   bash scripts/openbao-test.sh up rbac
#   set -a; source <(bash scripts/openbao-test.sh client rbac); set +a
#   docker compose -f docker/docker-compose.e2e.yml up -d
#   pnpm playwright test tests/e2e-rbac.spec.ts
#   docker compose -f docker/docker-compose.e2e.yml down
#
# Test Users (pre-configured in Keycloak pki-e2e realm):
#   - testadmin / Test123! (has 'admin' role)
#   - testuser / Test123! (has 'user' role, no admin)
#
# URLs (dedicated high ports chosen to avoid clashing with other local apps
# that commonly grab 3000/8080; keep these in sync with config.e2e.json, the
# keycloak-e2e-realm.json redirect URIs, and tests/e2e-rbac.spec.ts):
#   - Frontend: http://localhost:58080
#   - Backend API: http://localhost:53000
#   - Keycloak: http://localhost:58180
#   - OpenBao: isolated test instance

services:
  # Keycloak Identity Provider
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2  # same as the dev stack (keycloak/docker-compose.yml)
    container_name: pki-e2e-keycloak
    restart: unless-stopped
    ports:
      - "58180:8080"
    volumes:
      - ./keycloak-e2e-realm.json:/opt/keycloak/data/import/pki-e2e-realm.json:ro
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=false
      - KC_HTTP_PORT=8080
      # Keycloak 26+ hostname configuration - use full URL for consistent issuer
      - KC_HOSTNAME=http://localhost:58180
      - KC_HOSTNAME_STRICT=false
    command: start-dev --import-realm
    networks:
      - pki-e2e-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /realms/pki-e2e/.well-known/openid-configuration HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3;grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  # Backend API
  backend:
    image: ${ACCEPT_BACKEND_IMAGE:-ghcr.io/oriolrius/pki-manager-web/backend:${IMAGE_TAG:-latest}}
    container_name: pki-e2e-backend
    restart: unless-stopped
    networks:
      - pki-e2e-network
      - keystore
    volumes:
      - backend-data:/app/backend/data
      - ${OPENBAO_TEST_CLIENT_DIR:?run scripts/openbao-test.sh client rbac}:/run/openbao:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - LOG_LEVEL=info
      - FRONTEND_URL=http://localhost:58080
      - DATABASE_PATH=/app/backend/data/pki.db
      - OPENBAO_ADDR=https://openbao:8200
      - OPENBAO_TOKEN_FILE=/run/openbao/backend-token
      - OPENBAO_CACERT=/run/openbao/ca.pem
      - CRL_DISTRIBUTION_URL=http://localhost:53000/crl
      # OIDC Configuration - Keycloak
      # The issuer must match what Keycloak puts in tokens (localhost:58180)
      # But backend reaches Keycloak via Docker network (keycloak:8080)
      - OIDC_ISSUER=http://localhost:58180/realms/pki-e2e
      - OIDC_DISCOVERY_BASE_URL=http://keycloak:8080/realms/pki-e2e
      - OIDC_AUDIENCE=pki-web
      - OIDC_ROLES_CLAIM=realm_access.roles
    ports:
      - "53000:3000"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Frontend UI
  frontend:
    image: ${ACCEPT_FRONTEND_IMAGE:-ghcr.io/oriolrius/pki-manager-web/frontend:${IMAGE_TAG:-latest}}
    container_name: pki-e2e-frontend
    restart: unless-stopped
    networks:
      - pki-e2e-network
    volumes:
      - ./config.e2e.json:/usr/share/nginx/html/config.json:ro
    ports:
      - "58080:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  keystore:
    external: true
    name: ${OPENBAO_TEST_NETWORK:?run scripts/openbao-test.sh client rbac}
  pki-e2e-network:
    name: pki-e2e-network
    driver: bridge

volumes:
  backend-data:
