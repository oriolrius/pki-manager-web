# Optional overlay: docker compose -f docker-compose.yml -f docker-compose.scep.yml ...
services:
  scep:
    profiles: [scep]
    image: ${SCEP_IMAGE:-pki-manager-scep:local}
    build:
      context: ..
      dockerfile: scep/Dockerfile
    restart: unless-stopped
    command: [serve]
    read_only: true
    user: '10001:10001'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      SCEP_AUTH_MODE: ${SCEP_AUTH_MODE:-shared}
      SCEP_AUTO_PROVISION: ${SCEP_AUTO_PROVISION:-true}
      SCEP_RA_AUTO_RENEW: ${SCEP_RA_AUTO_RENEW:-true}
      SCEP_STATE_FILE: /data/ra.json
      NO_PROXY: backend,127.0.0.1,localhost
      SCEP_BACKEND_URL: ${SCEP_BACKEND_URL:?Set an HTTPS backend URL}
      SCEP_BACKEND_TOKEN_FILE: /run/secrets/scep_backend_token
      SCEP_CHALLENGE_FILE: /run/secrets/scep_challenge
      SCEP_VALIDITY_DAYS: ${SCEP_VALIDITY_DAYS:-90}
    secrets:
      - scep_backend_token
      - scep_challenge
    volumes:
      - scep-state:/data
    networks: [pki-network]
    ports:
      - '127.0.0.1:${SCEP_EXTERNAL_PORT:-8085}:8085'
    depends_on:
      backend:
        condition: service_healthy
secrets:
  scep_backend_token:
    file: ${SCEP_BACKEND_TOKEN_FILE:-./scep-secrets/backend-token}
  scep_challenge:
    file: ${SCEP_CHALLENGE_FILE:-./scep-secrets/challenge}
volumes:
  scep-state:
