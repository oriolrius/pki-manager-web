# The security headers plus the Content-Security-Policy of the files that nginx serves itself
# (the SPA, silent-renew.html, the assets). Not for the proxied backend locations: the backend
# sets its own CSP on the pages that it serves (Swagger UI: `staticCSP` in
# backend/src/rest/openapi.ts), and two CSP headers apply together.
#
# - script-src 'self': the build has no inline script (index.html and silent-renew.html load
#   /assets/*.js only) and the app needs no eval.
# - style-src 'unsafe-inline': React `style={...}` attributes and libraries set inline styles.
# - $pki_csp_sources: the origins of the API and of the OIDC provider. connect-src: the fetch
#   calls to the API and to the OIDC discovery and token endpoints. frame-src: the OIDC
#   silent-renew iframe. csp-sources.sh (the image entrypoint) writes
#   /etc/nginx/pki/csp-sources.conf at start, from the origins in config.json.
# - frame-ancestors 'self' (and X-Frame-Options SAMEORIGIN): only this origin can frame the
#   pages. The app frames its own /silent-renew.html.
include /etc/nginx/pki/security-headers.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'$pki_csp_sources; frame-src 'self'$pki_csp_sources; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
