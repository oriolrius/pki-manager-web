# Security headers of every response of the frontend container, the proxied backend ones too.
#
# nginx inherits `add_header` from the enclosing level ONLY when the current level has no
# `add_header` of its own (ngx_http_headers_module). So every `location` with its own `add_header`
# must include this file (or security-headers-csp.conf) again. docker/check-security-headers.sh
# checks the headers on the built image.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# OWASP: the legacy XSS auditor is unsafe, "0" turns it off in old browsers. The CSP replaces it.
add_header X-XSS-Protection "0" always;
