# Build-time default: only 'self'. csp-sources.sh (the image entrypoint) replaces this file at start
# with the http(s) origins of config.json (apiUrl, oidc.authority, cspSources) or the build-time API URL.
# Each value starts with a space (it follows 'self' in the CSP).
map $host $pki_csp_sources {
    default "";
}
