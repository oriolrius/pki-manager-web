name: SCEP
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths: ['scep/**', '.github/workflows/scep.yml', 'docker/docker-compose.scep.yml', 'docker/docker-compose.intune.yml', 'docker/docker-compose.mdm.yml']
  pull_request:
    paths: ['scep/**', '.github/workflows/scep.yml', 'docker/docker-compose.scep.yml', 'docker/docker-compose.intune.yml', 'docker/docker-compose.mdm.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: scep/go.sum
      - name: Verify module checksums
        working-directory: scep
        run: go mod verify
      - name: Test protocol and adapters
        working-directory: scep
        run: go test -race ./...
      - name: Vet and build
        working-directory: scep
        run: |
          go vet ./...
          go build -o /tmp/scep-server .
      - name: Check formatting
        working-directory: scep
        run: test -z "$(gofmt -l ./*.go)"
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Login to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}/scep
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build SCEP image (publish only main/releases)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: scep/Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
