name: SCEP
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths: ['scep/**', '.github/workflows/scep.yml', 'docker/docker-compose.scep.yml', 'docker/docker-compose.intune.yml', 'docker/docker-compose.mdm.yml']
  pull_request:
    paths: ['scep/**', '.github/workflows/scep.yml', 'docker/docker-compose.scep.yml', 'docker/docker-compose.intune.yml', 'docker/docker-compose.mdm.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: scep/go.sum
      - name: Verify module checksums
        working-directory: scep
        run: go mod verify
      - name: Test protocol and adapters
        working-directory: scep
        run: go test -race ./...
      - name: Vet and build
        working-directory: scep
        run: |
          go vet ./...
          go build -o /tmp/scep-server .
      - name: Check formatting
        working-directory: scep
        run: test -z "$(gofmt -l *.go)"
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/scep
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build SCEP image (publish only main/releases)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scep/Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
