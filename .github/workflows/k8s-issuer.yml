name: k8s-issuer

on:
  push:
    branches: [main]
    paths:
      - 'k8s/issuer/**'
      - '.github/workflows/k8s-issuer.yml'
    # A release tag vX.Y.Z also publishes the image tag X.Y.Z (the chart appVersion).
    tags: ['v*.*.*']
  workflow_dispatch: # run on an existing tag to (re)publish its image
  pull_request:
    paths:
      - 'k8s/issuer/**'
      - '.github/workflows/k8s-issuer.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    defaults:
      run:
        working-directory: k8s/issuer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.11'
          cache: true
          cache-dependency-path: k8s/issuer/go.sum

      - run: go mod download
      - run: go vet ./...
      - run: go test ./... -count=1

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        id: tag
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and push on main)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: k8s/issuer
          file: k8s/issuer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/pki-manager-issuer:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/pki-manager-issuer:latest
            ${{ steps.tag.outputs.version && format('ghcr.io/{0}/pki-manager-issuer:{1}', github.repository_owner, steps.tag.outputs.version) || '' }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign image (keyless)
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/pki-manager-issuer:${{ steps.tag.outputs.tag }}

      - name: Generate SBOM with syft
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ghcr.io/${{ github.repository_owner }}/pki-manager-issuer:${{ steps.tag.outputs.tag }}
          format: spdx-json
          artifact-name: sbom.spdx.json
          # On tag pushes the action would also attach the SBOM to the GitHub release, which needs
          # contents: write; keep least privilege and publish it as a workflow artifact only.
          upload-release-assets: false

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with: { version: v3.16.2 }
      - run: helm lint k8s/issuer/deploy/helm/pki-manager-issuer
      - run: helm template t k8s/issuer/deploy/helm/pki-manager-issuer > /tmp/rendered.yaml
      - run: head -5 /tmp/rendered.yaml
