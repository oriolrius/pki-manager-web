name: Ansible e2e

# Dockerized containers-as-hosts e2e for the ssh_host_cert role (via the
# published oriolrius.pki_manager collection). Brings up its own backend+KMS,
# applies the role to two managed-host containers, and asserts idempotence +
# real ssh login + principal RBAC + revocation on both KRL channels.
on:
  push:
    branches: [main]
    paths:
      - 'ansible/**'
      - 'backend/src/rest/routes/ssh**'
      - 'backend/src/services/ssh**'
      - 'krl-client/**'
      - '.github/workflows/ansible-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ansible/**'
      - 'backend/src/rest/routes/ssh**'
      - 'backend/src/services/ssh**'
      - 'krl-client/**'
      - '.github/workflows/ansible-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-host-cert-e2e:
    name: ssh_host_cert e2e (containers-as-hosts)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go (build the krl-client static binary)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.11'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install ansible-core
        # run.sh installs oriolrius.pki_manager + community.docker/crypto into
        # the e2e's own _collections dir (ANSIBLE_COLLECTIONS_PATH), so nothing
        # else is needed at the runner default path.
        # requirements.txt pins ansible-core and its dependencies by version and hash
        # (made with `uv pip compile --generate-hashes`, see requirements.in).
        run: python -m pip install --require-hashes -r ansible/tests/e2e/requirements.txt

      - name: Run the SSH host-cert e2e (strict — a skip is a failure in CI)
        working-directory: ansible/tests/e2e
        env:
          E2E_STRICT: '1'
        run: ./run.sh
