name: Security

# Secret scanning — fail the build if credentials, private keys, tokens, or
# other sensitive material are committed. Runs on ALL paths (a leak can land in
# any file), unlike the code-scoped test workflow. Allowlist: .gitleaks.toml.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so pushes are scanned across every new commit, not
          # just the tip. gitleaks-action scans the PR commit range on PRs.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # .gitleaks.toml at the repo root is picked up automatically.
