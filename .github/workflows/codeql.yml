name: CodeQL

# Static analysis (SAST) of the first-party code. Results go to the code scanning page.
# Languages: TypeScript/JavaScript (backend, frontend, site, tests), Go (issuer, SCEP gateway,
# krl-client), Python (test helpers) and the GitHub Actions workflows themselves.
# What is not scanned is in .github/codeql/codeql-config.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '25 4 * * 2' # Tuesdays 04:25 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          # Go needs a build. The three modules are built by hand (one `go.mod` each).
          - language: go
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build the Go modules
        if: matrix.language == 'go'
        run: |
          for module in k8s/issuer scep krl-client; do
            (cd "$module" && go build ./...)
          done

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
