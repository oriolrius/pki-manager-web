# Release
# Creates the GitHub Release when a version tag (vX.Y.Z) is pushed.
#
# This workflow OWNS the release object's title and notes: the title is the tag
# and the body is auto-generated by GitHub from the merged PRs / commits since the
# previous tag (generate_release_notes). The container images (docker-build.yml)
# and the signed krl-client binary (krl-client.yml) publish to the SAME tag in
# parallel; krl-client.yml only ATTACHES its binary assets and does not set the
# title/notes, so it can't clobber what this workflow writes.
#
# Usage:
#   cz bump --increment PATCH        # writes the vX.Y.Z bump commit + tag
#   git push && git push --tags      # this workflow then cuts the release
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: Checkout repository (full history for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
