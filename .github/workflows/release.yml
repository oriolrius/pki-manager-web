# Release
# Creates the GitHub Release when a version tag (vX.Y.Z) is pushed.
#
# This workflow OWNS the release object's title and notes: the title is the tag
# and the body is the matching `## vX.Y.Z` section of CHANGELOG.md (its title +
# short description + entries, curated at bump time), with GitHub's auto-notes
# appended as a fallback/compare-link (generate_release_notes). The container
# images (docker-build.yml) and the signed krl-client binary (krl-client.yml)
# publish to the SAME tag in parallel; krl-client.yml only ATTACHES its binary
# assets and sets neither title nor notes, so it can't clobber what this writes.
#
# Usage:
#   cz bump --increment PATCH        # writes the vX.Y.Z bump commit + CHANGELOG + tag
#   git push && git push --tags      # this workflow then cuts the release
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: Checkout repository (full history for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release title and notes from CHANGELOG
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          # The `## <tag>` section, everything up to (not including) the next `## `.
          SECTION=$(awk -v tag="$TAG" '
            $0 ~ "^## " tag "( |$)" { f=1; next }
            f && /^## / { exit }
            f { print }
          ' CHANGELOG.md)
          # Convention: the section's first non-blank line is the human title
          # (bold), which becomes "vX.Y.Z — <title>". The body is everything after
          # it, so the title is not repeated inside the notes.
          TITLE=$(printf '%s\n' "$SECTION" | sed -n '/[^[:space:]]/{s/^[[:space:]]*\*\*//;s/\*\*[[:space:]]*$//;p;q}')
          BODY=$(printf '%s\n' "$SECTION" | awk 'seen{print;next} /[^[:space:]]/{seen=1}' | sed '/./,$!d')
          if [ -n "$TITLE" ]; then
            echo "name=$TAG — $TITLE" >> "$GITHUB_OUTPUT"
          else
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
            BODY="$SECTION"
          fi
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            BODY="Release $TAG"
          fi
          printf '%s\n' "$BODY" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.name }}
          body_path: release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
