name: Docs site

# Builds the documentation site (docs/site, Astro Starlight) on every change to the docs.
# Pull requests: build + internal link check only. Push to main: build and deploy to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ['docs/**', '*.md', 'ansible/README.md', 'k8s/issuer/README.md', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', '*.md', 'ansible/README.md', 'k8s/issuer/README.md', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  PLANTUML_VERSION: '1.2026.9'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: docs/site/.nvmrc
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install PlantUML and fonts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq graphviz >/dev/null
          mkdir -p ~/.local/share/fonts && cp ../ssh/explainer/video/engine/fonts/*.ttf ~/.local/share/fonts/ && fc-cache -f >/dev/null
          curl -fsSL -o "$RUNNER_TEMP/plantuml.jar" \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar"
          echo "PLANTUML_JAR=$RUNNER_TEMP/plantuml.jar" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Build (sync docs, render diagrams, Astro, link check)
        run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
