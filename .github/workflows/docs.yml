name: Docs site

# Builds the documentation site (docs/site, Astro Starlight) on every change to the docs.
# Pull requests: build + internal link check only. Push to main: build and deploy to GitHub Pages.
on:
  push:
    # docs/site: first publication before the merge to main. Remove it after the merge.
    branches: [main, docs/site]
    paths: ['docs/**', '*.md', 'ansible/README.md', 'k8s/issuer/README.md', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', '*.md', 'ansible/README.md', 'k8s/issuer/README.md', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: docs/site/.nvmrc
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
      - name: Build (sync docs, render diagrams with plantuml.joor.net, Astro, link check)
        run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/dist

  deploy:
    # Push to main (or docs/site, see above), or by hand (Actions → Docs site → Run workflow)
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
