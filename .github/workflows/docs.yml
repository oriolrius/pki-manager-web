name: Docs site

# Builds the website (site/: product pages and docs, Astro + Starlight) on every change to its sources.
# The sources are the Markdown of the whole repository (docs/, backlog/decisions, backlog/docs, component
# READMEs, CHANGELOG.md): site/docs.config.mjs is the inventory, and the build fails on a file without a home.
# Pull requests: build + internal link check only. Push to main: build and deploy to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'site/**', '**/*.md', '!backlog/tasks/**', '!backlog/archive/**', '!backlog/milestones/**', 'backend/src/**', 'package.json', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'site/**', '**/*.md', '!backlog/tasks/**', '!backlog/archive/**', '!backlog/milestones/**', 'backend/src/**', 'package.json', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      # Full history and tags: each page shows the release that has its last change (scripts/version.mjs)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      # The API reference is generated from the backend source (scripts/openapi.mjs starts it briefly).
      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile
      - run: npm ci
      - name: Build (sync docs, render diagrams with plantuml.joor.net, OpenAPI from source, Astro, link check)
        run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  # Every runnable example of the API how-to must work against a real stack (published images).
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the demo stack
        run: site/demo/demo.sh up
      - name: Run the API how-to examples
        run: site/demo/doc-examples.sh docs/api/how-to.md
      - name: Stop the demo stack
        if: always()
        run: site/demo/demo.sh down

  deploy:
    # Push to main, or by hand (Actions → Docs site → Run workflow)
    if: github.event_name != 'pull_request'
    needs: [build, examples]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
