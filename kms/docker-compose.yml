services:
  kms:
    # Pinned: RA renewal requires fresh serials (tested with 5.28.0).
    # Explicit [http]/[db]/[workspace]/[logging] config persists keys;
    # keep this pin aligned with ansible/tests/e2e/docker-compose.yml.
    image: ghcr.io/cosmian/kms:5.28.0
    container_name: pki-manager-kms
    restart: unless-stopped
    ports:
      - "42998:9998"
    volumes:
      - ./data:/cosmian-kms/sqlite-data
      - ./kms.toml:/etc/cosmian/kms.toml:ro
    environment:
      # Ignored in config-file mode: set the log level in kms.toml ([logging] rust_log).
      - RUST_LOG=${RUST_LOG:-info}
      # Point the entrypoint at the mounted config. Without this, current images detect the
      # config at the default path AND inject default CLI args, which they now reject with
      # "Configuration file found at the default path ... but extra command-line arguments
      # were also provided." Setting COSMIAN_KMS_CONF makes the entrypoint use config-file mode.
      - COSMIAN_KMS_CONF=/etc/cosmian/kms.toml
    networks:
      - pki-manager-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9998/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  pki-manager-network:
    driver: bridge
