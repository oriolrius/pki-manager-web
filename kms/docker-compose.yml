services:
  kms:
    # Pinned (NOT :latest): :latest moved to 5.26.0, which renamed the [logging]
    # config key (`level` -> `rust_log`) and refuses to start with this kms.toml.
    # 5.24.0 is the version prod runs; keep it in sync with the e2e stack
    # (ansible/tests/e2e/docker-compose.yml).
    image: ghcr.io/cosmian/kms:5.24.0
    container_name: pki-manager-kms
    restart: unless-stopped
    ports:
      - "42998:9998"
    volumes:
      - ./data:/cosmian-kms/sqlite-data
      - ./kms.toml:/etc/cosmian/kms.toml:ro
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      # Point the entrypoint at the mounted config. Without this, current images detect the
      # config at the default path AND inject default CLI args, which they now reject with
      # "Configuration file found at the default path ... but extra command-line arguments
      # were also provided." Setting COSMIAN_KMS_CONF makes the entrypoint use config-file mode.
      - COSMIAN_KMS_CONF=/etc/cosmian/kms.toml
    networks:
      - pki-manager-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9998/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  pki-manager-network:
    driver: bridge
