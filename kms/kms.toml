# Cosmian KMS 5.24.0: explicit paths for persistent Docker deployments.
# When COSMIAN_KMS_CONF is set, configure server/database settings here;
# KMS environment/CLI overrides are ignored by config-file mode.

[http]
hostname = "0.0.0.0"
port = 9998

[db]
database_type = "sqlite"
sqlite_path = "/cosmian-kms/sqlite-data"
clear_database = false

[workspace]
root_data_path = "/cosmian-kms"
tmp_path = "/tmp"

[logging]
rust_log = "info"
