<!doctype html>
<!-- The site moved from GitHub Pages to https://pki-manager.oriolrius.cat. GitHub Pages serves
     this page for every old address; it sends the reader to the same page on the new site.
     Published by .github/workflows/docs.yml (job legacy-redirect) as index.html and 404.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PKI Manager has moved</title>
<link rel="canonical" href="https://pki-manager.oriolrius.cat/">
<script>
  var p = location.pathname.replace(/^\/pki-manager-web/, '') || '/';
  location.replace('https://pki-manager.oriolrius.cat' + p + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="2; url=https://pki-manager.oriolrius.cat/">
<style>body{font:16px/1.5 system-ui,sans-serif;margin:3rem 1rem;text-align:center;color:#151652;background:#fff}</style>
</head>
<body>
<p>The PKI Manager website moved to <a href="https://pki-manager.oriolrius.cat/">pki-manager.oriolrius.cat</a>.</p>
</body>
</html>
