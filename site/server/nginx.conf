# The website of PKI Manager, served by nginx (unprivileged image, read-only file system).
# Image: site/Dockerfile. Deployed on k5 behind the k5 Nginx Proxy Manager, which terminates TLS
# for https://pki-manager.oriolrius.cat. See docs/development/ci.md.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Behind a TLS proxy: a redirect must not name http:// or port 8080.
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    add_header X-Site-Revision "__REVISION__" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    error_page 404 /404.html;

    # The deploy job checks the revision here.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header X-Site-Revision "__REVISION__" always;
        add_header Cache-Control "no-store" always;
        return 200 "ok __REVISION__\n";
    }

    # Astro puts a content hash in these file names: they never change.
    location /_astro/ {
        add_header X-Site-Revision "__REVISION__" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header X-Site-Revision "__REVISION__" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
